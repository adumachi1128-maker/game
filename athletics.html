<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATHLETICS 陸上競技</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=M+PLUS+1p:wght@400;700;800&display=swap">
<style>
:root{
  color-scheme: dark;
  --night:#0b121a; --night2:#101c27; --panel:#142230; --panel2:#1b2d3c; --line:#26394a;
  --led:#ffb547; --led-soft:rgba(255,181,71,.14); --tartan:#c24a31; --tartan-deep:#8f3120; --grass:#2e6b4a;
  --flood:#dfeaf5; --ink:#eef2f4; --muted:#8fa2b0; --good:#6fd39a; --bad:#ff6b5b; --cyan:#5fd0e6;
  --gold:#ffcf4a; --silver:#cfd8de; --bronze:#d08a52;
  --disp:"Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --dot:"DotGothic16", "MS Gothic", monospace;
  --body:"M PLUS 1p", "Hiragino Sans", "Yu Gothic", sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;padding-inline:12px;padding-block:8px;overflow:hidden;color:var(--ink);font-family:var(--body);
  background:radial-gradient(120% 60% at 50% -10%, #1d3246 0%, var(--night) 60%) fixed, var(--night);
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{height:100%;max-width:620px;margin:0 auto;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.icon{background:var(--panel);border:1px solid var(--line);border-radius:10px;height:38px;min-width:38px;padding:0 10px;font-size:14px;font-weight:800;flex:none}

/* ===== menu ===== */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-top:4px}
.logo{margin:0;line-height:.9}
.logo b{display:block;font-family:var(--disp);font-weight:400;font-size:54px;letter-spacing:-.01em;color:var(--ink);text-shadow:0 0 30px rgba(223,234,245,.18)}
.logo b i{font-style:normal;color:var(--led)}
.logo span{display:block;font-family:var(--dot);font-size:12px;letter-spacing:.34em;color:var(--muted);margin-top:6px}
.lead{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.cups{display:flex;flex-direction:column;gap:0;padding-bottom:10px;position:relative}
.cup{position:relative;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;text-align:left;
  background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:7px}
.cup .no{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:15px;background:var(--night);border:1px solid var(--line);color:var(--muted)}
.cup.open .no{border-color:var(--led);color:var(--led)}
.cup .nm{font-family:var(--disp);font-size:17px;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.chip{font-size:10px;line-height:1;padding:3px 6px;border-radius:99px;background:rgba(255,255,255,.06);color:var(--muted);white-space:nowrap}
.chip.fin{background:var(--led-soft);color:var(--led)}
.cup .rt{text-align:right;font-family:var(--dot);font-size:16px;color:var(--led);font-variant-numeric:tabular-nums;white-space:nowrap}
.cup .rt small{display:block;font-family:var(--body);font-size:10px;color:var(--muted);margin-top:2px}
.cup[disabled]{cursor:default;opacity:.42}
.cup[disabled] .nm{color:var(--muted)}
.medal{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:5px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 10px rgba(255,207,74,.25)}
.m1{background:var(--gold)} .m2{background:var(--silver)} .m3{background:var(--bronze)}

/* ===== race ===== */
.bar{display:flex;align-items:center;gap:8px}
.ttl{flex:1;min-width:0;line-height:1.15}
.ttl small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl b{display:block;font-family:var(--disp);font-weight:400;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:2px;border-radius:8px;flex:none;
  background:#05080a;border:1px solid #243340;box-shadow:inset 0 0 0 1px #000}
.cell{padding:4px 8px;min-width:0;border-radius:5px;
  background:radial-gradient(circle at 1px 1px, rgba(255,181,71,.08) 1px, transparent 1.4px) 0 0/4px 4px, #080d10}
.cell .k{display:block;font-size:9px;letter-spacing:.16em;color:#6f7f8a}
.cell .v{display:block;font-family:var(--dot);font-size:20px;color:var(--led);font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(255,181,71,.55);white-space:nowrap;overflow:hidden}
.play{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.stage{position:relative;flex:1.2 1 0;min-height:0;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0b1217}
.stage canvas,.pad canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.call{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:var(--disp);font-size:clamp(30px,10vw,58px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.7),0 0 30px rgba(0,0,0,.6)}
.call.foul{color:var(--bad)} .call.go{color:var(--led)}
.pad{position:relative;flex:1 1 0;min-height:130px;border-radius:16px;border:1px solid var(--line);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;background:var(--panel)}

/* overlays */
.sheet{position:absolute;inset:0;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(180deg,rgba(16,28,39,.97),rgba(9,15,21,.98));border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--muted)}
.big{font-family:var(--disp);font-size:34px;line-height:1.1}
.big em{font-style:normal;color:var(--led)}
.rule{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--led-soft);color:var(--led);align-self:flex-start}
.lst{flex:1;min-height:0;overflow-y:auto;border-radius:8px;background:#070b0e;border:1px solid #1f2d38}
.lst table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.lst td{padding:5px 8px;border-bottom:1px solid #16222c;white-space:nowrap}
.lst td.ln{width:30px;font-family:var(--dot);color:var(--muted);text-align:center}
.lst td.nm{overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.lst td.t{text-align:right;font-family:var(--dot);color:var(--led)}
.lst td.q{width:22px;font-family:var(--disp);font-size:12px;color:var(--good);text-align:center}
.lst tr.me td{background:var(--led-soft);font-weight:800}
.lst tr.cut td{border-bottom:2px dashed rgba(111,211,154,.5)}
.sw{display:inline-block;width:8px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:7px}
.rhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rtime{font-family:var(--dot);font-size:22px;color:var(--ink)}
.status{font-weight:800;font-size:14px}
.status.ok{color:var(--good)} .status.out{color:var(--bad)} .status.gold{color:var(--gold)}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;margin-left:4px;vertical-align:2px}
.badge.pb{background:var(--good);color:#082014}
.badge.ng{background:#3a2a1a;color:var(--led)}
.badge.un{background:var(--led);color:#1d1508}
.mini{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted)}
.mini b{font-family:var(--dot);font-weight:400;color:var(--ink);font-size:13px;margin-left:3px}
.btns{display:flex;gap:8px;flex:none}
.btns button{flex:1;border:1px solid var(--line);border-radius:12px;padding:13px 6px;font-weight:800;font-size:15px;background:var(--panel2)}
.btns button.main{background:linear-gradient(180deg,#d8563a,var(--tartan-deep));border-color:#e0694d;color:#fff;box-shadow:0 6px 16px rgba(194,74,49,.35)}

/* ===== howto ===== */
.how{display:flex;flex-direction:column;gap:12px;padding-bottom:16px;font-size:14px;line-height:1.75}
.how section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.how h3{margin:0 0 6px;font-family:var(--disp);font-weight:400;font-size:16px;color:var(--led)}
.how p{margin:0} .how ol,.how ul{margin:0;padding-left:1.3em}
.how table{border-collapse:collapse;width:100%;font-size:13px;margin-top:4px}
.how td,.how th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.how th{color:var(--muted);font-weight:400}
.how kbd{font-family:var(--dot);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.hbtns{display:flex;gap:6px}
.tp{color:var(--cyan);font-family:var(--dot);font-size:13px;margin-left:4px}
.badge.tp2{background:var(--cyan);color:#06222a}
.train{display:flex;flex-direction:column;gap:10px;padding-bottom:16px}
.tsum{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.tsum small{display:block;font-size:11px;color:var(--muted)}
.tsum b{font-family:var(--dot);font-weight:400;font-size:26px;color:var(--led)}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:7px}
.thead{display:flex;justify-content:space-between;align-items:baseline}
.thead b{font-family:var(--disp);font-weight:400;font-size:17px}
.thead span{font-family:var(--dot);color:var(--led);font-size:15px}
.tdesc{font-size:12px;color:var(--muted);line-height:1.5}
.tbar{height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--tartan),var(--led))}
.tnow{display:flex;justify-content:space-between;font-size:12px;font-variant-numeric:tabular-nums}
.tnow em{font-style:normal;color:var(--good)}
.tup{border:1px solid #e0694d;border-radius:10px;padding:10px;font-weight:800;font-size:14px;background:linear-gradient(180deg,#d8563a,var(--tartan-deep));color:#fff}
.tup[disabled]{opacity:.35;cursor:default;background:var(--panel2);border-color:var(--line)}
@media (max-width:380px){ .logo b{font-size:44px} .cell .v{font-size:17px} .big{font-size:28px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
/* ===== 追加スタイル（種目一覧・大会一覧・試技表示） ===== */
.sec{font-family:var(--dot);font-size:12px;letter-spacing:.3em;color:var(--muted);margin:8px 2px 2px}
.evs{display:flex;flex-direction:column;padding-bottom:12px}
.evc{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;text-align:left;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px}
.evc .nm{font-family:var(--disp);font-size:16px;line-height:1.2}
.evc .ab{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
.evc .rt{text-align:right;font-family:var(--dot);font-size:14px;color:var(--led);white-space:nowrap}
.dots{display:flex;gap:3px;margin-top:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.1);display:block}
.dots i.g1{background:var(--gold)} .dots i.g2{background:var(--silver)} .dots i.g3{background:var(--bronze)} .dots i.op{background:var(--led-soft);box-shadow:inset 0 0 0 1px var(--led)}
.tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:99px;background:rgba(95,208,230,.14);color:var(--cyan);margin-left:6px;vertical-align:2px}
.cup .rt.s{font-size:15px}
.sel{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;height:38px;padding:0 8px;font:inherit;font-size:13px;width:100%}
.tryline{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.tryline b{font-family:var(--dot);font-weight:400;color:var(--ink);font-size:13px;margin-left:3px}
.tryline b.f{color:var(--bad)} .tryline b.best{color:var(--led)}
.lst td.pts{text-align:right;font-family:var(--dot);color:var(--cyan);font-size:12px}
.cardrow{display:flex;gap:6px}
.card{width:14px;height:20px;border-radius:2px;background:#e7c43a;border:1px solid #8a6f10}

.els{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 8px}
.els i{font-style:normal;font-size:10px;color:var(--cyan);border:1px solid rgba(95,208,230,.45);border-radius:10px;padding:1px 8px}
.ghostbtn{margin-left:auto;font-size:10px;color:var(--muted);background:none;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:2px 10px;cursor:pointer}

.gear .grow{display:flex;align-items:baseline;gap:8px;font-size:12px}
.gear .gk{color:var(--muted);width:86px;flex:none}
.gear .grow b{flex:1;font-weight:700}
.gear .gv{font-family:var(--dot);color:var(--led)}
.badge.sp{background:linear-gradient(90deg,#ffcf4a,#ff9f43);color:#1a1100}
</style>
</head>
<body>
<div class="app">
  <!-- 種目一覧 -->
  <div class="screen" id="scMenu">
    <div class="hero">
      <h1 class="logo"><b>ATH<i>L</i>ETICS</b><span>OLYMPIC TRACK &amp; FIELD</span></h1>
      <div class="hbtns"><button class="icon" id="toTrain">育成<span class="tp" id="tpMenu"></span></button><button class="icon" id="toHow1">遊び方</button></div>
    </div>
    <p class="lead">25種目から選んで挑戦。各種目は8つの大会（市民大会→オリンピック）に分かれ、決勝で3位以内に入ると次の大会へ。走る・跳ぶ・投げるとTPがたまるので「育成」で強化しましょう。</p>
    <div class="evs scroll" id="events"></div>
  </div>

  <!-- 大会一覧（種目ごと） -->
  <div class="screen" id="scTiers" hidden>
    <div class="bar"><button class="icon" id="tiersBack">← 種目</button><div class="ttl"><small id="tiTag">種目</small><b id="tiName">100m</b></div><button class="icon" id="toHow3">?</button></div>
    <p class="lead" id="tiAbout"></p>
    <div class="cups scroll" id="cups"></div>
  </div>

  <!-- レース -->
  <div class="screen" id="scRace" hidden>
    <div class="bar">
      <button class="icon" id="toMenu" aria-label="大会一覧へ">≡</button>
      <div class="ttl"><small id="tCup">大会</small><b id="tRound">予選</b></div>
      <button class="icon" id="toHow2" aria-label="遊び方">?</button>
    </div>
    <div class="board">
      <div class="cell"><span class="k" id="kA">TIME</span><span class="v" id="bTime">0.00</span></div>
      <div class="cell"><span class="k" id="kB">km/h</span><span class="v" id="bSpeed">0.0</span></div>
      <div class="cell"><span class="k" id="kC">POS</span><span class="v" id="bRank">-</span></div>
      <div class="cell"><span class="k" id="kD">BEST</span><span class="v" id="bPB">--.--</span></div>
    </div>
    <div class="play">
      <div class="stage" id="stage"><canvas id="cv"></canvas><div class="call" id="call"></div></div>
      <div class="pad" id="pad" role="button" tabindex="0" aria-label="タップエリア"><canvas id="rc"></canvas></div>

      <div class="sheet" id="intro" hidden>
        <div class="eyebrow" id="iCup">大会</div>
        <div class="big" id="iRound">予選 <em>3組</em></div>
        <div class="rule" id="iRule">上位4着 → 準決勝</div>
        <div class="els" id="iEl"></div>
        <div class="lst"><table><tbody id="iList"></tbody></table></div>
        <div class="btns"><button id="iBack">大会一覧</button><button class="main" id="iGo">位置につく</button></div>
      </div>

      <div class="sheet" id="result" hidden>
        <div class="eyebrow" id="rCup">大会</div>
        <div class="rhead"><span class="big" id="rPos">1着</span><span class="rtime" id="rTime">10.00</span></div>
        <div><span class="status" id="rStatus"></span><span id="rBadges"></span></div>
        <div class="lst"><table><tbody id="rList"></tbody></table></div>
        <div class="mini" id="rMini"></div>
        <div class="btns" id="rBtns"></div>
      </div>
    </div>
  </div>

  <!-- 育成 -->
  <div class="screen" id="scTrain" hidden>
    <div class="bar"><button class="icon" id="trainBack">← 戻る</button><div class="ttl"><small>レースで獲得したTPで強化</small><b>育成</b></div><div class="tp" id="tTPbar" style="font-size:16px"></div></div>
    <div class="train scroll">
      <select class="sel" id="tSel" aria-label="理論値を見る種目"></select>
      <div class="tsum"><div><small id="tIdealLbl">いまの理論値（ミスなし）</small><b id="tIdeal">--.--</b><small id="tIdealSub"></small></div><div style="text-align:right"><small>所持TP</small><b id="tTP" style="color:var(--cyan)">0</b></div></div>
      <div id="tGear" class="tcard gear"></div>
      <div id="tList" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>
  </div>

  <!-- 遊び方 -->
  <div class="screen" id="scHow" hidden>
    <div class="bar"><button class="icon" id="howBack">← 戻る</button><div class="ttl"><b>遊び方</b></div></div>
    <div class="how scroll" id="howBody"></div>
  </div>
</div>
<script>
(() => {
// ===== 00-logic.js : 画面に依存しない計算（種目データ・較正・理論値・得点） =====
const LANES=8, ME=3;
const TIERS=[
  {name:'市民大会',sub:'市民陸上競技会',pool:'jp'},{name:'地区大会',sub:'県南地区予選',pool:'jp'},
  {name:'県大会',sub:'県選手権',pool:'jp'},{name:'全国大会',sub:'全日本実業団',pool:'jp'},
  {name:'日本選手権',sub:'日本一決定戦',pool:'jp'},{name:'アジア大会',sub:'アジア一決定戦',pool:'as'},
  {name:'世界陸上',sub:'世界選手権',pool:'w'},{name:'オリンピック',sub:'五輪',pool:'w'}];
const POOLS={
  jp:['サトウ','スズキ','タカハシ','ナカムラ','コバヤシ','ヤマモト','イトウ','ワタナベ','カトウ','ヨシダ','ヤマダ','ササキ','マツモト','イノウエ','キムラ','シミズ','モリ','イケダ','ハシモト','アベ'],
  as:['チェン','キム','パク','ワン','リー','シン','グエン','アル＝サイード','ラーマン','タン','オン','ハサン','ヤマグチ','ソン','ファン'],
  w:['ルーカス','サンチェス','オコンクォ','ハリス','ミラー','カーン','ベイリー','ロドリゲス','ンドゥール','パーマー','ディアス','オルセン','モロー','フェレイラ','アダムス','ブラント','クワメ','シモンズ','グラント','デュボワ']};
const R_HEAT={name:'予選',q:4,groups:6}, R_QF={name:'準々決勝',q:3,groups:4}, R_SF={name:'準決勝',q:2,groups:3}, R_F={name:'決勝',q:3,groups:0};
const WIN={P:0.08,G:0.15,O:0.22}, GAIN={P:0.12,G:0.08,O:0.03,M:-0.03};
const JT={P:'PERFECT',G:'GOOD',O:'OK',M:'MISS'}, JC={P:'#ffb547',G:'#6fd39a',O:'#5fd0e6',M:'#ff6b5b'};
const MAXLV=20, STAT_KEYS=['spd','acc','sta','pow','tec'];
const tierGap=t=>0.22*(7-t)/7;            // 優勝ラインが「五輪の優勝記録」からどれだけ離れているか
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const gauss=()=>{ let s=0; for(let i=0;i<6;i++) s+=Math.random(); return (s-3)/Math.sqrt(0.5); };

// ---- 種目定義 -------------------------------------------------------------
// eng: phys=タップ走(リズム) / dist=ペース配分走 / field=タイミング競技 / combo=混成

function comboPoints(comboEv,bid,val){

const physVc=(ev,st)=>ev.k*(10+(ev.span||0.12)*st.spd), physAc=st=>0.75+0.02*st.acc, physFd=(ev,st)=>1-(ev.fdk||0.03)*st.sta;
function physFadeBase(ev,x){ const lx=ev.leg?x%ev.leg:x; return lx>ev.fadeFrom?(lx-ev.fadeFrom)*ev.fadeRate:0; }
const periodOf=(v,ev)=>Math.max(0.50,Math.min(0.9,5.6/Math.max(v,3)))*(ev.pm||1);
function physGateXs(ev){
  const g=[];
  if(ev.hurdle){ for(let i=0;i<ev.hurdle.n;i++) g.push(ev.hurdle.first+i*ev.hurdle.gap-1.8); }
  if(ev.baton){ for(let L=1;L<=3;L++) g.push(L*ev.leg-2.2); }
  return g.sort((a,b)=>a-b);
}
// 理論値＝「全部PERFECTで押し続けたとき」（パワーが貯まるまでの立ち上がり・ハードル/受け渡しも含む／風なし・反応0.15秒・DIPあり）
function idealPhys(ev,st){
  let v=0,x=0,t=0.15,p=0.45; const dt=0.005, vc=physVc(ev,st), ac=physAc(st), fd=physFd(ev,st), gates=physGateXs(ev); let gi=0;
  let beatT=t+periodOf(0,ev);
  while(x<ev.D){
    let tg=vc*p; const f=physFadeBase(ev,x); if(f>0) tg*=1-f*fd;
    if(v<tg) v=Math.min(tg,v+(2+7*(1-v/13))*dt*ac); else v=Math.max(tg,v-3*dt);
    x+=v*dt; t+=dt;
    if(gi<gates.length&&x>=gates[gi]-5){ if(x>=gates[gi]){ p=Math.min(1,p+GAIN.P); gi++; beatT=t+periodOf(v,ev)*0.5; } }
    else if(x<ev.D-3.5&&t>=beatT){ p=Math.min(1,p+GAIN.P); beatT+=periodOf(v,ev); }
  }
  return t-0.05;
}
const ALLMAX=()=>({spd:MAXLV,acc:MAXLV,sta:MAXLV,pow:MAXLV,tec:MAXLV});
const distA=st=>0.65*st.sta/MAXLV+0.35*st.spd/MAXLV;
function distParams(ev,st){
  const n=ev.legs||1, A=distA(st), T=ev.Te*0.995*(1.19-0.19*A);
  const Wp=ev.W20*(0.45+0.55*st.spd/MAXLV), Dl=ev.D/n;
  const CS=n*(Dl-Wp)/(T-1.2);
  return {T,W:Wp,CS,n,Dl,pmax:ev.D/ev.Te*(ev.walk?1.12:1.22),pmin:ev.D/ev.Te*0.5,lift:ev.walk?CS*1.05:0};
}
function fieldA(ev,st){ const w=ev.w; return w.spd*st.spd/MAXLV+w.pow*st.pow/MAXLV+w.tec*st.tec/MAXLV; }
const idealField=(ev,st)=>ev.Te*1.005*(0.815+0.185*fieldA(ev,st));
function idealOf(ev,st){
  if(ev.eng==='phys') return idealPhys(ev,st);
  if(ev.eng==='dist') return distParams(ev,st).T;
  if(ev.eng==='field') return idealField(ev,st);
  let tot=0; for(let i=0;i<ev.list.length;i++){ const se=subEvent(ev,i); tot+=comboPoints(ev,se.baseId,idealOf(se,st)); } return tot;
}
function calibrate(ev){   // タップ走：k(速度係数)とspan(最高速Lvの効き)を、Lv20=優勝記録の0.5%増し／Lv0=優勝記録+17%になるよう合わせる
  if(ev.eng!=='phys') return ev;
  if(ev.fixedK){ ev.k=1; ev.span=0.12; return ev; }
  const mx=ALLMAX(), z=newStats(), goal=ev.Te*0.995;
  const fitK=()=>{ let lo=0.3,hi=2.2; for(let i=0;i<30;i++){ ev.k=(lo+hi)/2; if(idealPhys(ev,mx)>goal) lo=ev.k; else hi=ev.k; } ev.k=(lo+hi)/2; };
  let lo=0.01,hi=0.2;
  for(let i=0;i<16;i++){ ev.span=(lo+hi)/2; fitK(); if(idealPhys(ev,z)/ev.Te>1.17) hi=ev.span; else lo=ev.span; }
  ev.span=(lo+hi)/2; fitK(); return ev;
}

function fmtTime(t){
  if(t==null||!isFinite(t)) return '--.--';
  if(t<60) return t.toFixed(2);
  if(t<3600){ const m=Math.floor(t/60), s=t-m*60; return m+':'+(s<10?'0':'')+s.toFixed(2); }
  const h=Math.floor(t/3600), m=Math.floor((t-h*3600)/60), s=Math.floor(t-h*3600-m*60);
  return h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function fmtVal(ev,v,short){
  if(v==null||!isFinite(v)) return ev.unit==='s'?'--.--':'--';
  if(ev.unit==='s') return fmtTime(v)+(short?'':'');
  if(ev.unit==='pt') return Math.round(v)+'点';
  return v.toFixed(2)+(short?'':'m');
}

// ---- 相手選手の生成 -----------------------------------------------------------
function makeOpponents(ev,tier,left,names,spreads){
  // 返り値: 7人分 {name, target(最終記録の目標), react, tau, a(ペース型), look は呼び出し側}
  const out=[]; spreads=spreads||shuffle([0,1,2,3,4,5,6].map(j=>j/6*0.055));
  for(let k=0;k<7;k++){
    const g=tierGap(tier)+spreads[k]+0.018*left+(Math.random()-.5)*0.012;
    const target=ev.dir<0?ev.Te*(1+g):ev.Te*(1-g);
    out.push({name:names[k],target,sb:ev.dir<0?target*(1+Math.random()*0.012-0.002):target*(1-Math.random()*0.012+0.002),
      spread:spreads[k],react:0.13+Math.random()*0.07,tau:1.05+Math.random()*0.25,a:(Math.random()*0.035-0.012)});
  }
  return out;
}
// 相手の位置（時刻tのとき）。finT は目標タイム
function oppPos(ev,r,t){
  const T=r.target, tt=t-r.react;
  if(tt<=0) return 0;
  const span=T-r.react;
  if(ev.eng==='phys'){
    const vmax=ev.D/(span-r.tau*(1-Math.exp(-span/r.tau)));
    if(tt<=span) return vmax*(tt-r.tau*(1-Math.exp(-tt/r.tau)));
    return ev.D+(tt-span)*Math.max(1.5,vmax*0.6);
  }
  const u=tt/span;
  if(u>=1) return ev.D+(tt-span)*Math.max(1.5,ev.D/span*0.7);
  const a=ev.walk?r.a*0.4:r.a;
  return ev.D*(u+a*Math.sin(Math.PI*u));
}

function oppAttempts(ev,target,n){

  for(let i=0;i<n;i++) arr.push(Math.random()<0.14?0:base*(1+gauss()*0.022*0.6*2));
  return arr;
}
// 走高跳・棒高跳の相手：バーを順に挑戦
function barList(ev){
  const id=ev.baseId||ev.id, out=[]; const hi=ev.Te*1.06; let h=Math.round(ev.Te*0.72*100)/100;
  const step=id==='PV'?(x=>x<ev.Te*0.85?0.15:x<ev.Te*0.93?0.10:0.05):(x=>x<ev.Te*0.85?0.05:x<ev.Te*0.92?0.03:0.02);
  while(h<=hi+1e-9){ out.push(Math.round(h*100)/100); h+=step(h); }
  return out;
}
function startBarIndex(ev,st,bars){ const t=0.8*idealField(ev,st); let i=0; while(i<bars.length-1&&bars[i+1]<=t) i++; return i; }
function oppVert(ev,cap,bars){
  let best=0,fails=0,total=0;
  for(const b of bars){
    let ok=false;
    for(let a=0;a<3;a++){
      const p=1/(1+Math.exp((b-cap)/(0.012*ev.Te)));
      if(Math.random()<p){ ok=true; break; } fails++; total++;
      if(fails>=3) break;
    }
    if(ok){ best=b; fails=0; } else break;
  }
  return {best,total};
}
// 試技のタイミング列（秒）。kind別のリング構成
function seqSpec(ev){
  const id=ev.baseId||ev.id;
  const S={
    LJ:{run:7,p0:.52,p1:.40,after:[['take','踏切',.42,'ang']]},
    TJ:{run:6,p0:.52,p1:.40,after:[['take','ホップ',.42],['step','ステップ',.55],['jump','ジャンプ',.6,'ang']]},
    HJ:{run:5,p0:.55,p1:.45,after:[['take','踏切',.45,'ang']]},
    PV:{run:7,p0:.55,p1:.42,after:[['take','ポール突き',.45,'pv']]},
    SP:{run:3,p0:.55,p1:.45,after:[['rel','リリース',.5,'ang']]},
    DT:{run:4,p0:.55,p1:.42,after:[['rel','リリース',.45,'ang']]},
    HT:{run:5,p0:.62,p1:.36,after:[['rel','リリース',.4,'ang']]},
    JT:{run:6,p0:.5,p1:.38,after:[['rel','リリース',.4,'ang']]}}[id];
  const rings=[]; let t=1.2;                    // 最初のリングは1.2秒後
  for(let i=0;i<S.run;i++){ rings.push({k:'run',t,label:'助走'}); t+=S.p0+(S.p1-S.p0)*(i+1)/S.run; }
  // 最後のrunリング後の間隔は after の最初の値に置き換える
  t=rings[rings.length-1].t;
  S.after.forEach(a=>{ t+=a[2]; rings.push({k:a[0],t,label:a[1],hold:a[3]||null}); });
  return rings;
}
// 判定結果から記録を計算。res={runScore(0-1), q:[判定の配列(special)], foul}
const QF={P:1,G:0.985,O:0.95,M:0.9};
// 長押しで決める角度：最適角とその判定（±2°=P ±4.5°=G ±8°=O）
const ANG_OPT={LJ:22,TJ:18,HJ:48,SP:38,DT:35,HT:44,JT:34}, ANG_RATE=30, ANG_MAX=75;
const angFactor=d=>Math.max(0.35,1-0.0012*d*d);     // 目安からのずれ：5°→−3%、10°→−12%、20°→−48%
const angGrade=d=>{ d=Math.abs(d); return d<=2?'P':d<=4.5?'G':d<=8?'O':'M'; };
const PV_UP=1.05;   // 棒高跳：ポールを突いてから最高点（離す時）までの秒数
function fieldPerf(ev,st,res){
  if(res.foul) return 0;
  let f=0.86+0.14*res.runScore;
  for(const g of res.q){ f*=QF[g]; }
  return idealField(ev,st)*f;
}

function distInit(ev,st){ const P=distParams(ev,st); return {x:0,v:0,W:P.W,pace:0,t:0,P,leg:0,ex:false,lift:0,cards:0,dq:false,draft:false}; }
function distGuide(s){        // ゴールで予備体力がちょうど0になるペース（目安）
  const P=s.P, remLeg=P.Dl*(s.leg+1)-s.x;
  let rem=P.Dl*P.n-s.x; // 全体の残り
  // 区間内で使える予備体力だけを見る（リレーは区間ごとに回復する）
  const r=Math.max(1,remLeg), W=Math.max(0,s.W);
  const need=(P.n>1&&s.leg<P.n-1)?P.Dl:r;      // 次区間以降は全力で走れる前提なので、いまの区間で配分
  if(r<=W) return P.pmax;
  return clamp(P.CS*r/(r-W),P.pmin,P.pmax);
}
function distStep(s,dt){
  const P=s.P;
  let pc=clamp(s.pace,P.pmin,P.pmax);
  if(s.ex) pc=Math.min(pc,P.CS*0.86);
  s.v+=(pc-s.v)*Math.min(1,dt/1.2);
  const ve=s.v*(s.draft?0.94:1);
  if(ve>P.CS) s.W-=(ve-P.CS)*dt; else s.W=Math.min(P.W,s.W+(P.CS-ve)*0.35*dt);
  s.W=Math.max(-120,s.W);
  if(s.W<=0) s.ex=true; else if(s.ex&&s.W>0.12*P.W) s.ex=false;
  if(P.lift){ if(s.v>P.lift) s.lift+=(s.v-P.lift)/P.lift*dt*0.9; else s.lift=Math.max(0,s.lift-dt*0.05);
    if(s.lift>=1){ s.lift=0; s.cards++; if(s.cards>=3) s.dq=true; } }
  const old=s.x; s.x+=s.v*dt; s.t+=dt;
  if(P.n>1){ const lg=Math.min(P.n-1,Math.floor(s.x/P.Dl)); if(lg>s.leg){ s.leg=lg; s.W=P.W; s.ex=false; } }
  return old;
}

function lineValOf(ev,t){   // その大会の優勝ラインの目安（混成は得点の合計）
  if(ev.eng!=='combo') return lineVal(ev,t);
  let tot=0; for(let i=0;i<ev.list.length;i++){ const se=subEvent(ev,i); tot+=comboPoints(ev,se.baseId,lineVal(se,t)); } return tot;
}

  const d=ev.dir<0?cur-nx:nx-cur;

  if(ev.unit==='s') return `次のLv → <em>理論タイム −${d>=60?fmtTime(d):d.toFixed(2)}秒</em>`;

}

}

function drawStands(standH,shift,t,cheer){
  const g=ctx.createLinearGradient(0,0,0,standH); g.addColorStop(0,'#08111a'); g.addColorStop(1,'#1a2c3b');
  ctx.fillStyle=g; ctx.fillRect(-10,-10,W+20,standH+10);
  const lo=shift*0.12, sp=240;
  for(let i=Math.floor(lo/sp)-1;i<(lo+W)/sp+1;i++){
    const x=i*sp-lo+60, ty=standH*0.16;
    const glow=ctx.createRadialGradient(x,ty,2,x,ty,standH*0.9);
    glow.addColorStop(0,'rgba(223,234,245,.35)'); glow.addColorStop(1,'rgba(223,234,245,0)');
    ctx.fillStyle=glow; ctx.fillRect(x-standH,ty-standH,standH*2,standH*2);
    ctx.fillStyle='#dfeaf5'; ctx.fillRect(x-11,ty-4,22,8);
    ctx.fillStyle='rgba(223,234,245,.5)'; for(let j=-2;j<=2;j++) ctx.fillRect(x+j*4.4-1,ty-3,2,6);
  }
  const off=shift*0.35, cw=7;
  ctx.fillStyle='#0e1a24'; ctx.fillRect(-10,standH*0.36,W+20,standH*0.64);
  for(let row=0;row<4;row++){
    const y=standH*0.44+row*standH*0.13;
    for(let i=Math.floor(off/cw)-1;i<(off+W)/cw+1;i++){
      const r=rnd(i*7+row*1000); if(r<0.12) continue;
      const jump=cheer&&rnd(i+row)>.55?Math.abs(Math.sin(t*9+i))*2.2:0;
      ctx.fillStyle=`hsl(${Math.floor(r*360)},${30+r*30}%,${34+row*7}%)`;
      ctx.beginPath(); ctx.arc(i*cw-off+(row%2)*3,y-jump,2.4,0,7); ctx.fill();
    }
  }
  ctx.fillStyle='#223544'; ctx.fillRect(-10,standH-7,W+20,7);
}

const cycLen=v=>Math.max(1.6,0.42*v);                // 1周期(2歩)で進む距離
function shade(hex,f){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;

  if(r.walk) lean=0.1;
  const TH=h*0.25, SH=h*0.25;
  const jp=r.jp, bj=jp?Math.min(1,Math.sin(Math.PI*clamp(jp.ph,0,1))*1.8):0;   // ハードル跳越の度合い 0〜1

// ===== 任意ポーズ（跳躍・投てき用） =====
// P: {tr:胴の前傾(度), nk:首, legs:[{t:太もも(胴基準・度),k:膝の曲げ,f:足首}, …](手前,奥), arms:[{u:上腕(胴基準),e:肘}|{to:[x,y]}]}
function mkPose(hip,P,h){
  const tr=(P.tr||0)*D2R, TH=h*0.25, SH=h*0.25;
  const sh=limb(hip[0],hip[1],Math.PI-tr,h*0.33), head=limb(sh[0],sh[1],Math.PI-tr-(P.nk||0)*D2R,h*0.125);
  const legs=P.legs.map((L,i)=>{ const a1=L.t*D2R-tr, a2=a1-L.k*D2R; const kn=limb(hip[0],hip[1],a1,TH), an=limb(kn[0],kn[1],a2,SH); return {far:i===1,kn,an,fa:a2+1.55+(L.f||0)*D2R}; });
  const arms=P.arms.map((A,i)=>{ if(A.to) return armTo(sh,A.to,i===1,h,A.b); const ua=A.u*D2R-tr; const el=limb(sh[0],sh[1],ua,h*0.165), hd=limb(el[0],el[1],ua+A.e*D2R,h*0.15); return {far:i===1,sh,el,hd}; });
  return {hip,sh,head,legs,arms,lean:tr,hrot:tr+(P.nk||0)*D2R};
}
// 肩から目標点へ腕を伸ばす（2関節IK）。届かなければ伸ばしきり
function armTo(sh,to,far,h,bend){
  const l1=h*0.165,l2=h*0.15, dx=to[0]-sh[0], dy=to[1]-sh[1], d=Math.max(1e-3,Math.min(Math.hypot(dx,dy),l1+l2-0.5)), a=Math.atan2(dy,dx);
  const c=clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1), b=Math.acos(c)*(bend==null?1:bend);
  return {far,sh,el:[sh[0]+Math.cos(a+b)*l1,sh[1]+Math.sin(a+b)*l1],hd:[sh[0]+Math.cos(a)*d,sh[1]+Math.sin(a)*d]};
}
// 走りの脚はそのまま、胴の傾きだけ変える
function reTrunk(J,trDeg,h){ const tr=trDeg*D2R; J.sh=limb(J.hip[0],J.hip[1],Math.PI-tr,h*0.33); J.head=limb(J.sh[0],J.sh[1],Math.PI-tr*0.8,h*0.125); J.hrot=tr*0.6; J.lean=tr; J.arms.forEach(a=>a.sh=J.sh); return J; }

// ===== 20-phys.js : タップ走（100m/200m/400m/ハードル/4×100mリレー） =====
const dipBonus=(x,D)=>x>=D-0.8?0.05:x>=D-1.7?0.035:0.015;
const DIPLEN=3.5;

function physCreate(){
  const ev=RUN.cur, D=ev.D;
  const wind=(D<=200)?Math.round((Math.random()*3.4-1.1)*10)/10:0;
  const st={ kind:'phys', ev, D, win:22, mstep:D<=120?10:D<=210?20:50, phase:'idle', t:0, callT:0, setDur:0, wind,
    runners: RUN.entries.map((e,i)=>({ name:e.name, lane:i+1, me:!!e.me, x:0, v:0, fin:null, rt:null, cyc:Math.random(), look:e.look,
      target:e.me?0:e.target*(1-wind*0.004), react:e.react||0.15, tau:e.tau||1.1 })),
    power:0.45, nextBeat:null, prevBeat:0, beats:0, judge:null, judgeT:0, combo:0, maxCombo:0, lastHit:-1, early:0, tickBeat:-1,
    cnt:{P:0,G:0,O:0,M:0}, gcnt:{P:0,G:0,O:0,M:0}, spl:[], errs:[], t80:null, maxV:0, dip:null, doneAt:null, flash:0, shake:0, photo:0, gates:[], hurdleX:[], zones:[], leg:0, msgT:0 };
  if(ev.hurdle){ const h=ev.hurdle; for(let i=0;i<h.n;i++){ const hx=h.first+i*h.gap; st.hurdleX.push(hx); st.gates.push({x:hx-1.8,kind:'H',done:false,res:null}); } }
  if(ev.baton){ for(let L=1;L<=3;L++){ st.gates.push({x:L*ev.leg-2.2,kind:'B',done:false,res:null}); st.zones.push(L*ev.leg); } }
  return st;
}
function physStart(){ S.phase='marks'; S.callT=0; show('位置について',''); }
const nextGate=()=>S.gates.find(g=>!g.done);
function physTap(){
  S.flash=0.12;
  if(S.phase==='idle'||S.phase==='foul'){ S=physCreate(); physStart(); return; }
  if(S.phase==='set'){ S.phase='foul'; show('フライング！','foul'); beep(220,.5,.08); buzz(300); return; }
  if(S.phase!=='run') return;
  const me=S.runners[ME]; if(me.fin!==null) return;
  if(me.rt===null){ me.rt=S.t; S.prevBeat=S.t; S.nextBeat=S.t+periodOf(0,S.ev); beep(660,.06,.04); return; }
  const g=nextGate();
  if(g&&me.x>=g.x-5){
    const err=(me.x-g.x)/Math.max(me.v,5), a=Math.abs(err);
    if(a<=WIN.O){ g.err=err; g.vb=me.v; gateResolve(g,a<=WIN.P?'P':a<=WIN.G?'G':'O'); } else if(err<0) S.early=0.3;
    return;
  }
  if(me.x>=S.D-DIPLEN){ if(S.dip===null){ S.dip=me.x; beep(990,.12,.05); buzz(40); } return; }
  if(S.t-S.lastHit<0.12) return;
  const err=S.t-S.nextBeat, a=Math.abs(err);
  if(a<=WIN.O){ S.lastHit=S.t; physJudge(a<=WIN.P?'P':a<=WIN.G?'G':'O',err); advanceBeat(); }
  else if(err<0) S.early=0.3;
}
function advanceBeat(){ S.prevBeat=S.nextBeat; S.nextBeat+=periodOf(S.runners[ME].v,S.ev); S.beats++; }
function physJudge(g,err){
  if(err!==undefined&&g!=='M') S.errs.push(err);
  S.cnt[g]++; S.power=clamp(S.power+GAIN[g],0.4,1);
  if(g==='M'){ S.combo=0; beep(150,.1,.05); buzz(60); }
  else { S.combo++; S.maxCombo=Math.max(S.maxCombo,S.combo); beep(g==='P'?880:g==='G'?660:520,.05,.04,'triangle'); if(g==='P') buzz(15); }
  S.judge={g,early:err!==undefined&&g!=='P'&&err<0}; S.judgeT=0.5;
}
function say(t,c,ms){ show(t,c); const tok=S; setTimeout(()=>{ if(S===tok&&S.phase==='run') show('',''); },ms||600); }
function gateResolve(g,jg){
  const me=S.runners[ME]; g.done=true; g.res=jg; S.gcnt[jg]++; if(jg==='P') S.cnt.P++;
  if(jg!=='M') S.power=clamp(S.power+GAIN[jg],0.4,1);
  if(g.kind==='H'){
    if(jg==='P'){ say('ナイスクリア','go'); beep(880,.06,.04,'triangle'); }
    else if(jg==='G'){ beep(660,.05,.04,'triangle'); }
    else if(jg==='O'){ me.v*=0.97; beep(520,.05,.04,'triangle'); }
    else { me.v*=0.80; S.power=clamp(S.power-0.1,0.4,1); say('接触！','foul'); beep(140,.18,.07); buzz(120); S.shake=0.2; }
  } else {
    if(jg==='P'){ say('バトンパス！','go'); beep(990,.08,.05,'triangle'); }
    else if(jg==='G'){ me.v*=0.99; beep(700,.06,.04,'triangle'); }
    else if(jg==='O'){ me.v*=0.97; beep(520,.05,.04,'triangle'); }
    else { me.v*=0.88; say('受け渡しミス','foul'); beep(140,.18,.07); buzz(120); }
  }
  S.prevBeat=S.t; S.nextBeat=S.t+periodOf(me.v,S.ev)*0.5; S.lastHit=S.t;
}
function physUpdate(dt){
  if(!S) return;
  S.flash=Math.max(0,S.flash-dt); S.judgeT=Math.max(0,S.judgeT-dt); S.early=Math.max(0,S.early-dt);
  S.shake=Math.max(0,S.shake-dt); S.photo=Math.max(0,S.photo-dt);
  if(S.phase==='marks'){ S.callT+=dt; if(S.callT>1.6){ S.phase='set'; S.callT=0; S.setDur=1.1+Math.random()*1.3; show('用意',''); } physBoard(); return; }
  if(S.phase==='set'){ S.callT+=dt; if(S.callT>=S.setDur){ S.phase='run'; S.t=0; S.shake=0.25; show('ドン！','go'); pistol(); const tok=S; setTimeout(()=>{ if(S===tok&&S.phase==='run') show('',''); },600); } return; }
  if(S.phase!=='run') return;
  const ev=S.ev, D=S.D, me=S.runners[ME];
  S.t+=dt;
  const g=nextGate();
  if(g&&me.fin===null&&me.rt!==null&&me.x-g.x>WIN.O*Math.max(me.v,5)){ g.err=null; g.vb=me.v; gateResolve(g,'M'); }
  const gAct=!!(g&&!g.done&&me.x>=g.x-5);
  const active=me.rt!==null&&me.fin===null&&me.x<D-DIPLEN&&!gAct;
  if(active&&S.t>=S.nextBeat&&S.tickBeat!==S.beats){ S.tickBeat=S.beats; beep(S.beats%2?1200:1000,.035,.035,'sine'); }
  if(active&&S.t>S.nextBeat+WIN.O){ physJudge('M'); advanceBeat(); }
  let target=me.rt===null?0:physVc(ev,SAVE.st)*gearF()*S.power*(1+S.wind*0.004);
  const fb=physFadeBase(ev,me.x); if(fb>0) target*=1-fb*physFd(ev,SAVE.st);
  if(me.fin===null){ if(me.v<target) me.v=Math.min(target,me.v+(2+7*(1-me.v/13))*dt*physAc(SAVE.st)); else me.v=Math.max(target,me.v-3*dt); }
  else me.v=Math.max(1.5,me.v-4*dt);
  const old=me.x; me.x+=me.v*dt;
  if(ev.leg) S.leg=Math.min(3,Math.floor(me.x/ev.leg));
  if(active){ const f=Math.min(1,(S.t-S.prevBeat)/Math.max(0.01,S.nextBeat-S.prevBeat)); me.cyc=S.beats+f; }
  else me.cyc+=me.v*dt/cycLen(me.v);
  if(me.fin===null&&me.x>=D){ let fin=S.t-dt*(me.x-D)/Math.max(0.001,me.x-old); if(S.dip!==null) fin-=dipBonus(S.dip,D); me.fin=fin; S.photo=0.25; beep(880,.15,.05); }
  S.maxV=Math.max(S.maxV,me.v);
  if(me.fin===null){ const q=S.spl.length; if(q<3&&me.x>=D*(q+1)/4) S.spl.push(S.t); if(S.t80===null&&me.x>=D*0.8) S.t80=S.t; }
  S.gates.forEach(g=>{ if(g.done&&g.vb&&g.va==null&&me.x>=g.x+(g.kind==='H'?5:6)) g.va=me.v; });
  S.runners.forEach(r=>{
    if(r.me) return;
    const o=r.x; r.x=oppPos(ev,r,S.t); r.v=(r.x-o)/dt||0;

    r.cyc+=(r.x-o)/cycLen(Math.max(r.v,1));
  });
  if((me.fin!==null&&S.runners.every(r=>r.me||r.fin!==null))||S.t>ev.Te*2.5){ if(S.doneAt===null) S.doneAt=S.t; if(S.t-S.doneAt>1.0) physFinish(); }
  physBoard();
}
function physRanking(){ return [...S.runners].sort((a,b)=>{ if(a.fin!==null&&b.fin!==null) return a.fin-b.fin; if(a.fin!==null) return -1; if(b.fin!==null) return 1; return b.x-a.x; }); }
function physBoard(){

      +(S.gates.length?`<span>${S.ev.baton?'受け渡し':'ハードル'}<b>${S.gcnt.P+S.gcnt.G+S.gcnt.O}/${S.gates.length}</b></span>`:'')
      +`<span>DIP<b>${S.dip!==null?'−'+dipBonus(S.dip,S.D).toFixed(3):'なし'}</b></span>`+(S.D<=200?`<span>風<b>${(S.wind>=0?'+':'')+S.wind.toFixed(1)}</b></span>`:'')+pm.html});

// ---- タップ面

  else {
    const per=S.nextBeat-S.prevBeat, inP=Math.abs(S.t-S.nextBeat)<=WIN.P, band=R*1.15*WIN.P/per;
    rx.lineWidth=band*2; rx.strokeStyle='rgba(255,181,71,.12)'; rx.beginPath(); rx.arc(cx,cy,R,0,7); rx.stroke();
    ring(cx,cy,R,inP);

// ===== 25-track.js : トラック（走る種目）の舞台描画。phys=実寸 / dist=時間圧縮 =====
function drawTrack(dt){
  if(!S||!W) return;
  dt=dt||0.016;
  const me=S.runners[ME], D=S.D, distMode=S.kind==='dist';
  const standH=Math.max(52,H*0.24), trackTop=standH, laneH=(H-trackTop-7)/LANES;
  const pxm=W/S.win, px0=W*(distMode?0.4:0.3);
  const gs=distMode?S.gs:1;

  const cam=me.x-px0/pxm;                                  // phys: 実際の位置が基準
  const X=distMode?(m=>px0+(m-me.x)/gs*pxm):(m=>(m-cam)*pxm);   // 真の距離 -> 画面
  const sc=distMode?S.vis:cam;                              // 景色の流れ

  ctx.save();
  if(S.shake>0) ctx.translate((Math.random()-.5)*5*S.shake*4,(Math.random()-.5)*3*S.shake*4);

  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillRect(mx1-1,my-5,2,10);
  if(S.ev.legs||S.ev.leg){ const n=S.ev.legs||(S.ev.leg?D/S.ev.leg:1); for(let L=1;L<n;L++){ ctx.fillStyle='rgba(95,208,230,.5)'; ctx.fillRect(mx0+(mx1-mx0)*L/n-0.5,my-4,1,8); } }
  S.runners.forEach(r=>{ if(r.me) return; ctx.fillStyle=JERSEY[r.lane-1]; ctx.beginPath(); ctx.arc(mx0+(mx1-mx0)*clamp(r.x/D,0,1),my,3,0,7); ctx.fill(); });
  ctx.fillStyle='#ffb547'; ctx.beginPath(); ctx.arc(mx0+(mx1-mx0)*clamp(me.x/D,0,1),my,4.5,0,7); ctx.fill();
  // トラック面
  const tg=ctx.createLinearGradient(0,trackTop,0,H); tg.addColorStop(0,'#b0432c'); tg.addColorStop(1,'#c9503a');
  ctx.fillStyle=tg; ctx.fillRect(-10,trackTop,W+20,H-trackTop+10);
  ctx.fillStyle='rgba(0,0,0,.06)';
  if(distMode){ const st=2; for(let m=Math.floor((sc-px0/pxm)/st)*st;m<sc+(W-px0)/pxm+st;m+=st) ctx.fillRect(Xs(m),trackTop,1,LANES*laneH); }
  else for(let m=Math.floor(cam);m<cam+S.win+2;m+=0.5){ ctx.fillRect(X(m),trackTop,1,LANES*laneH); }
  ctx.fillStyle='#2e6b4a'; ctx.fillRect(-10,H-7,W+20,8);
  ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1.3;
  for(let i=0;i<=LANES;i++){ const y=trackTop+i*laneH; ctx.beginPath(); ctx.moveTo(-10,y); ctx.lineTo(W+10,y); ctx.stroke(); }
  ctx.fillStyle='rgba(255,181,71,.07)'; ctx.fillRect(-10,trackTop+ME*laneH,W+20,laneH);
  ctx.textAlign='center';
  if(distMode){
    // 景色の目印（ラベル無し）
    ctx.fillStyle='rgba(255,255,255,.35)';
    const st=10; for(let m=Math.floor((sc-px0/pxm)/st)*st;m<sc+(W-px0)/pxm+st;m+=st) ctx.fillRect(Xs(m)-1,trackTop,2,LANES*laneH);
    // スタート／区間／ゴール
    const lines=[[0,'START','#fff']]; for(let L=1;L<(S.ev.legs||1);L++) lines.push([D/S.ev.legs*L,'EXCHANGE','#5fd0e6']);
    lines.forEach(([m,tx,col])=>{ const x=X(m); if(x<-40||x>W+40) return; ctx.fillStyle=col; ctx.fillRect(x-2,trackTop,4,LANES*laneH); ctx.font='10px '+DOT; ctx.fillText(tx,x,trackTop-12); });
    const fx=X(D); if(fx>-60&&fx<W+60){ const sz=laneH/4;
      for(let yy=0;yy<LANES*4;yy++) for(let xx=0;xx<3;xx++){ ctx.fillStyle=(xx+yy)%2?'#111':'#f4f4f4'; ctx.fillRect(fx+xx*sz-sz*1.5,trackTop+yy*sz,sz,sz); }
      ctx.fillStyle='#ffb547'; ctx.font='12px '+DISP; ctx.fillText('FINISH',fx,trackTop-12); }
    (S.waterX||[]).forEach(wx=>{ const x=X(wx); if(x<-120||x>W+120) return; ctx.fillStyle='rgba(60,150,220,.75)'; ctx.fillRect(x,trackTop,pxm*7,LANES*laneH);
      ctx.fillStyle='#fff'; ctx.font='10px '+DOT; ctx.fillText('水濠',x+pxm*3.5,trackTop-12); });
    // 障害（91.4cm）：水濠の手前にも同じ障害
    S.gates.forEach((g,gi)=>{ if(g.kind!=='X'&&g.kind!=='W') return; const x=X(g.x); if(x<-60||x>W+60) return;
      const hit=g.res==='M'&&me.x>g.x;
      for(let l=0;l<LANES;l++){ const fy=trackTop+l*laneH+laneH*0.8; drawBarrier(x,fy,0.51*laneH*1.95,Math.max(pxm*1.6,laneH*1.25),hit&&l===ME); } });
  } else {
    S.zones.forEach(zx=>{ ctx.fillStyle='rgba(95,208,230,.14)'; ctx.fillRect(X(zx-9),trackTop,pxm*13,LANES*laneH); ctx.fillStyle='rgba(95,208,230,.8)'; ctx.fillRect(X(zx)-1,trackTop,2,LANES*laneH); });
    const step=S.mstep;
    for(let m=Math.max(0,Math.floor(cam/step)*step); m<=Math.min(D,cam+S.win+step); m+=step){
      const x=X(m); if(x<-40||x>W+40) continue;
      if(m>=D) continue;
      ctx.fillStyle=m===0?'#fff':'rgba(255,255,255,.55)'; ctx.fillRect(x-(m===0?2:1),trackTop,m===0?4:2,LANES*laneH);
      ctx.fillStyle='#fff'; ctx.font='10px '+DOT; ctx.fillText(m===0?'START':fmtDist(m),x,trackTop-12);
    }
    const fx=X(D); if(fx>-60&&fx<W+60){ const sz=laneH/4;
      for(let yy=0;yy<LANES*4;yy++) for(let xx=0;xx<3;xx++){ ctx.fillStyle=(xx+yy)%2?'#111':'#f4f4f4'; ctx.fillRect(fx+xx*sz-sz*1.5,trackTop+yy*sz,sz,sz); }
      ctx.fillStyle='#fff'; ctx.fillRect(fx-1.5,16,3,trackTop-16); ctx.fillStyle='#ffb547'; ctx.font='12px '+DISP; ctx.fillText('FINISH',fx,trackTop-12); }
    ctx.font=`${Math.round(laneH*0.62)}px ${DISP}`; ctx.fillStyle='rgba(255,255,255,.8)'; ctx.textBaseline='middle';
    for(let i=0;i<LANES;i++){ const x=X(-2.6); if(x>-30) ctx.fillText(String(i+1),x,trackTop+i*laneH+laneH*0.55); }
    ctx.textBaseline='alphabetic';
    if(S.ev.dip!==false&&S.kind==='phys'){ const dx=X(D-DIPLEN); if(dx>-10&&dx<W+10){ ctx.fillStyle='rgba(255,181,71,.2)'; ctx.fillRect(dx,trackTop,X(D)-dx,LANES*laneH); } }
    // ハードル（全レーン。手前の足＋支柱＋赤白の横板で「ハードル」と分かる形）
    S.hurdleX.forEach((hx,i)=>{ const x=X(hx); if(x<-40||x>W+40) return;
      for(let l=0;l<LANES;l++){ const fy=trackTop+l*laneH+laneH*0.8, hh=hurH*laneH*1.95;
        const g=(l===ME)?S.gates[i]:null, down=g&&g.res==='M'&&me.x>hx-0.3;
        const fall=down?clamp((me.x-hx+0.3)/1.6,0,1):0;
        drawHurdle(x,fy,hh,Math.max(pxm*0.9,laneH*0.55),fall); } });
  }
  ctx.textAlign='left';
  if(!distMode&&me.v>8&&S.phase==='run'){
    const a=Math.min(.22,(me.v-8)*0.05), len=(me.v-7)*pxm*0.9;
    ctx.fillStyle=`rgba(255,255,255,${a})`;
    for(let i=0;i<14;i++){ const y=trackTop+rnd(i*3.1)*(H-trackTop); const x=((rnd(i)*W*2 - me.x*pxm*1.6)%(W*1.4)+W*1.4)%(W*1.4)-W*0.2; ctx.fillRect(x,y,len,1.2); }
  }
  const h=laneH*1.95, nLeg=S.ev.legs||(S.ev.leg?Math.round(D/S.ev.leg):0);
  for(let i=0;i<LANES;i++){ const r=S.runners[i], fy=trackTop+i*laneH+laneH*0.8;
    if(nLeg){ drawRelayLane(r,i,X,fy,h,dt,nLeg,distMode?S.gs:1); continue; }
    r.jp=null;
    if(distMode&&S.ev.water){ const sf=S.gs; for(const g of S.gates){ if(g.kind!=='X'&&g.kind!=='W') continue; const ph=(r.x-(g.x-2.0*sf))/((g.kind==='W'?4.2:3.3)*sf);
      if(ph>0&&ph<1){ const gr=(i===ME)?(g.res||'P'):'P'; r.jp={ph,hF:0.51,sc:gr==='M'?0.6:gr==='O'?0.93:1}; break; } } }
    else if(S.hurdleX.length){ for(let k=0;k<S.hurdleX.length;k++){ const ph=(r.x-(S.hurdleX[k]-2.0))/3.3;
      if(ph>0&&ph<1){ const gr=(i===ME&&S.gates[k])?S.gates[k].res:'P'; r.jp={ph,hF:hurH,sc:gr==='M'?0.6:gr==='O'?0.93:1}; break; } } }
    drawRunner(r,X(r.x),fy,h); }
  ctx.restore();
  if(S.photo>0){ ctx.fillStyle=`rgba(255,255,255,${S.photo*2})`; ctx.fillRect(0,0,W,H); }
  drawConfetti(dt);
}
function drawConfetti(dt){
  if(confetti.length){
    confetti.forEach(p=>{ p.y+=p.vy*dt; p.x+=p.vx*dt+Math.sin(p.y*0.03+p.w)*0.6; p.r+=dt*5;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    confetti=confetti.filter(p=>p.y<H+20);
  }
}
function spawnConfetti(){
  const cols=['#ffcf4a','#ffb547','#6fd39a','#5fd0e6','#ff6b5b','#ffffff'];
  for(let i=0;i<120;i++) confetti.push({x:Math.random()*W,y:-Math.random()*H*0.6,vx:(Math.random()-.5)*40,vy:60+Math.random()*80,r:Math.random()*6,s:3+Math.random()*4,c:cols[i%cols.length],w:Math.random()*6});
}

// ---- ハードル本体：脚（手前に張り出す）＋支柱＋赤白の板。fall=0〜1で前に倒れる
function drawHurdle(x,fy,hh,wd,fall){
  ctx.save(); ctx.translate(x,fy); if(fall>0) ctx.rotate(fall*1.45);
  ctx.lineCap='round';
  ctx.strokeStyle='#2a3038'; ctx.lineWidth=Math.max(2,hh*0.07);
  ctx.beginPath(); ctx.moveTo(-wd*0.5,0); ctx.lineTo(wd*0.12,0); ctx.moveTo(0,0); ctx.lineTo(0,-hh); ctx.stroke();      // 足と支柱
  const bh=hh*0.3, bx=-wd*0.1, by=-hh;
  ctx.fillStyle='#fafafa'; ctx.fillRect(bx-wd*0.0,by,wd*0.62,bh);
  ctx.fillStyle='#e8412f'; for(let k=0;k<4;k++) if(k%2===0) ctx.fillRect(bx+k*wd*0.155,by,wd*0.155,bh);                  // 赤白ストライプ
  ctx.strokeStyle='#1a1f26'; ctx.lineWidth=1.2; ctx.strokeRect(bx,by,wd*0.62,bh);
  ctx.restore();
}
// ---- リレー：1レーンに最大3人（待機の次走者／走る人／走り終えた前走者）＋バトン
function drawRelayLane(r,i,X,fy,h,dt,n,sf){
  const D=S.D, seg=D/n, E=k=>seg*k-2*sf;
  if(!r.team){ r.team=[r.look]; for(let k=1;k<n;k++) r.team.push(makeLook(i,false,r.look&&r.look.fem)); r.rc=[]; r.coff=[0]; }
  let c=0; for(let k=1;k<n;k++) if(r.x>=E(k)) c=k;
  const mk=(k,x,v,cyc)=>({look:r.team[k],lane:r.lane,me:false,x,v,cyc,fin:null,noBlock:true});
  const track=(k,vx,cycIn)=>{ let st=r.rc[k]; if(!st) st=r.rc[k]={px:vx,cyc:cycIn!=null?cycIn:Math.random()};
    const dv=(vx-st.px)/sf; st.px=vx; if(cycIn!=null) st.cyc=cycIn; else if(dt>0){ const v=Math.abs(dv)/dt; st.cyc+=dv/cycLen(Math.max(v,1)); st.v=v; } return st; };
  if(r.coff[c]==null) r.coff[c]=(r.rc[c]?r.rc[c].cyc:0)-r.cyc;
  const cvx=r.x+(c>0?0.9*sf*clamp(1-(r.x-E(c))/(5*sf),0,1):0);
  const car=mk(c,c===0?r.x:r.x+1000,r.v,r.cyc+r.coff[c]); car.me=r.me; car.fin=r.fin; car.jp=null; car.noBlock=c!==0;
  if(c===0&&r.x>25) car.x=r.x;                     // 通常走
  track(c,cvx,car.cyc);
  const items=[];                                  // [描画順, runner, 真の距離]
  // 前走者（渡した後に減速して流れる）
  if(c>=1){ const u=(r.x-E(c))/sf, xo=E(c)+8*sf*(1-Math.exp(-u/8)); const st=track(c-1,xo); const o=mk(c-1,xo+1000,Math.max(0.5,r.v*Math.exp(-u/8)),st.cyc); items.push([0,o,xo]); }
  // 次走者（ゾーンで待機→加速して受ける）
  let recv=null;
  if(c+1<=n-1){ const Z=seg*(c+1), s0=Z-9*sf, p=clamp((r.x-(E(c+1)-18*sf))/(18*sf),0,1), xr=s0+(E(c+1)+0.9*sf-s0)*p*p;
    const st=track(c+1,xr); const o=mk(c+1,p<=0?0:(xr-s0)/sf*3+0.02,p<=0?0:Math.max(0,(r.v*2*p)),st.cyc); if(p<=0) o.cyc=0; recv=o; items.push([0,o,xr]); }
  items.push([1,car,cvx]);
  items.forEach(([,o,vx])=>{ const px=X(vx); if(px<-90||px>W+90) return; drawRunner(o,px,fy,h); });
  // バトン
  let bx=null, by=null, bang=-0.35;
  const hand=o=>o&&o.hand;
  if(c+1<=n-1||c>=1){
    const k=c+1<=n-1&&(r.x>E(c+1)-1.5*sf)?c+1:c;                         // 直近の受け渡し点
    const e=E(k), t=(r.x-(e-1.5*sf))/(3*sf);
    const miss=r.me&&S.gates&&S.gates[k-1]&&S.gates[k-1].res==='M';
    if(t<0||t>1){ const o=(k===c&&t>1)?car:(recv&&t<0?car:car); const hd=hand(o); if(hd){ bx=hd[0]; by=hd[1]; } }
    else {
      const oldO=(k===c)?items.find(a=>a[1].look===r.team[c-1])?.[1]:car, newO=(k===c)?car:recv;
      const h0=oldO&&hand(oldO), h1=newO&&(newO.handF||hand(newO));
      if(h0&&h1){ const tt=miss&&t>0.35?0.35:t; bx=h0[0]+(h1[0]-h0[0])*tt; by=h0[1]+(h1[1]-h0[1])*tt-Math.sin(Math.PI*tt)*h*0.05;
        if(miss&&t>0.35){ const f=clamp((t-0.35)/0.4,0,1); by=by+(fy-by-h*0.03)*f*f; bang=-0.35+f*1.2; }
        if(!miss&&t>0.2&&t<0.8){ ctx.strokeStyle=`rgba(95,208,230,${0.8*Math.sin(Math.PI*t)})`; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(bx,by,h*(0.08+0.18*t),0,7); ctx.stroke(); } }
    }
    if(miss&&r.x>e+1.5*sf){ if(r.x<e+5*sf){ bx=X(e+0.6*sf); by=fy-h*0.03; bang=0.85; } }
  }
  if(bx!=null){ const L=h*0.2; ctx.save(); ctx.translate(bx,by); ctx.rotate(bang); ctx.lineCap='round'; ctx.strokeStyle='#ffcf4a'; ctx.lineWidth=Math.max(3,h*0.045);
    ctx.beginPath(); ctx.moveTo(-L/2,0); ctx.lineTo(L/2,0); ctx.stroke(); ctx.strokeStyle='#8a5a00'; ctx.lineWidth=Math.max(1,h*0.012); ctx.beginPath(); ctx.moveTo(-L*0.12,0); ctx.lineTo(L*0.12,0); ctx.stroke(); ctx.restore(); }
}

// ---- 3000m障害の障害：太い角材（白黒）と頑丈な脚。hit=接触で少し揺れる
function drawBarrier(x,fy,hh,wd,hit){
  ctx.save(); ctx.translate(x,fy); if(hit) ctx.rotate(Math.sin(S.t*40)*0.03);
  ctx.fillStyle='#2a3038'; const lw=Math.max(2.5,hh*0.09);
  ctx.fillRect(-wd*0.32,-hh,lw,hh); ctx.fillRect(wd*0.3-lw,-hh,lw,hh);                 // 脚2本
  ctx.fillRect(-wd*0.42,-lw*0.6,wd*0.22,lw*0.6); ctx.fillRect(wd*0.2,-lw*0.6,wd*0.22,lw*0.6); // 台
  const bh=Math.max(5,hh*0.26); ctx.fillStyle='#f6f6f2'; ctx.fillRect(-wd*0.4,-hh,wd*0.8,bh);
  ctx.fillStyle='#111'; for(let k=0;k<5;k++) if(k%2===1) ctx.fillRect(-wd*0.4+k*wd*0.16,-hh,wd*0.16,bh);
  ctx.strokeStyle='#1a1f26'; ctx.lineWidth=1; ctx.strokeRect(-wd*0.4,-hh,wd*0.8,bh);
  ctx.restore();
}

// ===== 30-dist.js : ペース配分走（800m〜マラソン・競歩・4×400m） =====
function distCreate(){
  const ev=RUN.cur, sim=distInit(ev,SAVE.st);
  { const gf=gearF(), P=sim.P; P.CS*=gf; P.pmax*=gf; P.pmin*=gf; if(P.lift) P.lift*=gf; }
  sim.pace=sim.P.CS;
  const eff0=(sim.P.CS-sim.P.pmin)/(sim.P.pmax-sim.P.pmin);
  const st={ kind:'dist', ev, D:ev.D, win:ev.win, ts:ev.ts, gs:Math.max(1,Math.sqrt(ev.ts)/2), vis:0, mstep:10, phase:'idle', t:0, callT:0, setDur:0,
    sim, eff:eff0, hold:0, jflash:0, flash:0, shake:0, photo:0, dip:null, doneAt:null, zones:[], hurdleX:[], gates:[], waterX:[], gcnt:{P:0,G:0,O:0,M:0}, cnt:{P:0,G:0,O:0,M:0},
    runners: RUN.entries.map((e,i)=>({ name:e.name, lane:i+1, me:!!e.me, x:0, v:0, fin:null, rt:null, cyc:Math.random(), look:e.look, walk:!!ev.walk,
      target:e.me?0:e.target, react:e.react||0.15, tau:e.tau||1.1, a:e.a||0 })), judge:null, judgeT:0, minW:1e9, dqAt:null, dm:{dev:0,n:0,rash:0,rn:0,spl:[],t90:null,w90:null} };
  if(ev.legs){ const seg=ev.D/ev.legs; for(let k=1;k<ev.legs;k++){ st.gates.push({x:seg*k-2*st.gs,kind:'B',done:false,res:null}); } }
  if(ev.water){ for(let k=1;k*ev.water.every-100<=ev.D-150;k++){ const gx=k*ev.water.every-100; st.gates.push({x:gx,kind:'W',done:false,res:null}); st.waterX.push(gx); }
    // 障害（高さ91.4cm）：1周400mに4台。水濠を含めて約80mごと
    for(let L=0;L*400<ev.D;L++) [60,140,220,380].forEach(o=>{ const x=L*400+o; if(x<=ev.D-40) st.gates.push({x,kind:'X',done:false,res:null}); });
    st.gates.sort((a,b)=>a.x-b.x); }

function fieldTap(p){

      S.judge={g:'M',line:true}; S.judgeT=0.8; S.ri=S.rings.length; fieldEndAttempt(); return; }

function fieldEndAttempt(){

    if(ok){ S.bestBar=bar; S.consFail=0; S.ba=0; S.bi++; S.hist.push('o');
      S.lastText='クリア！ '+bar.toFixed(2)+'m'; S.lastCol='go'; fanfareLite();

    S.attNo++;

    ctx.fillStyle='#d6b778'; ctx.fillRect(SX(p0),top,SX(p1)-SX(p0),H-top-7); ctx.fillStyle='rgba(0,0,0,.08)'; ctx.fillRect(SX(p0),top,SX(p1)-SX(p0),4);
    ctx.font='10px '+DOT; for(let m=Math.ceil(p0);m<=p1;m++){ const x=SX(m); ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(x,top+4,1,8); if(m%(id==='TJ'?2:1)===0&&m>=(id==='TJ'?12:4)){ ctx.fillStyle='rgba(60,40,10,.9)'; ctx.fillText(m+'m',x,H-14); } }
    // 踏切板（白・幅20cm）と踏切線。踏切線より先を踏むとファウル
    const yT=FV.gy-FV.ppm*0.55, yB=FV.gy+FV.ppm*0.35, lx=SX(0);

// 成功した試技では、バーと支柱の幅の範囲で、体のどの点（関節・頭・手足の先・各部の中点）もバーより上を通るようにする。
// 必要な持ち上げ量を試技の最初に全コマ分計算し、なめらかな山にして腰の高さへ足す（毎フレーム持ち上げるとガタつくため）
function needOver(J,sx,barX,bar,depth){
  const d=(depth||0.35)*FV.ppm, bx=SX(barX), by=SY(bar), tn=Math.tan(0.42), mg=FV.h*0.09, soft=0.1*FV.ppm;
  const x0=bx-0.25*FV.ppm, x1=bx+d+0.12*FV.ppm;
  const X=p=>J.hip[0]+(p[0]-J.hip[0])*(sx==null?1:sx);
  const pts=[J.hip,J.sh,J.head,[J.head[0],J.head[1]-FV.h*0.07]]; J.legs.forEach(l=>{ pts.push(l.kn,l.an,[l.an[0]+Math.sin(l.fa)*FV.h*0.09,l.an[1]+Math.cos(l.fa)*FV.h*0.09]); });
  J.arms.forEach(a=>pts.push(a.el,a.hd));
  const seg=[[J.hip,J.sh],[J.sh,J.head]]; J.legs.forEach(l=>{ seg.push([J.hip,l.kn],[l.kn,l.an]); }); J.arms.forEach(a=>seg.push([a.sh,a.el],[a.el,a.hd]));
  seg.forEach(([a,b])=>{ for(const t of [0.25,0.5,0.75]) pts.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]); });

    const yb=by-(clamp(x,bx-0.15*d,bx+0.95*d)-bx)*tn-mg; need=Math.max(need,(p[1]-yb)*w); });

}
function liftProfile(fn,barX,bar,depth){
  const N=60, need=[]; for(let k=0;k<=N;k++){ const r=fn(k/N,0); need.push(r?needOver(r.J,r.sx,barX,bar,depth):0); }

  return env.map((_,i)=>{ let s=0,c=0; for(let j=-5;j<=5;j++){ const v=env[i+j]; if(v!=null){ s+=v; c++; } } return s/c; });

const liftAt=(P,u)=>{ if(!P) return 0; const f=clamp(u,0,1)*(P.length-1), i=Math.floor(f), t=f-i; return P[i]+((P[Math.min(i+1,P.length-1)])-P[i])*t; };

function poleCarry(hipX,p,J){       // 助走中のポール：後ろ手(上の手)とポール先端
  const hip=[hipX,0.95], R=[hipX-0.08,1.1], al=lerp(1.05,0.05,Math.pow(Math.min(1,p/0.86),1.4));

  if(b>0){ const T=[hipX+0.15,2.25]; G=[lerp(R[0],T[0],b),lerp(R[1],T[1],b)]; const tipP=[0,0];
    const tipC=[lerp(tip[0],tipP[0],b),lerp(tip[1],tipP[1],b)], dd=Math.hypot(tipC[0]-G[0],tipC[1]-G[1]); tip=[G[0]+(tipC[0]-G[0])/dd*POLE_L,G[1]+(tipC[1]-G[1])/dd*POLE_L]; }

function drawPole(a,b,bend){

  if(bend){ const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2, dx=B[0]-A[0], dy=B[1]-A[1], L=Math.hypot(dx,dy)||1; ctx.quadraticCurveTo(mx+dy/L*bend*FV.ppm,my-dx/L*bend*FV.ppm,B[0],B[1]); }

}

  const th0=Math.atan2(2.25,4.01), tc=clamp(tau,0,1.25), th=lerp(th0,Math.PI/2,ease(Math.min(1,tc))), bendK=Math.sin(Math.PI*clamp(tc/0.85,0,1));

  ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(sx0,sy0); ctx.lineTo(sx0+L*1.1,sy0); ctx.stroke();
  ctx.strokeStyle='#ffb547'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(sx0,sy0); ctx.lineTo(sx0+Math.cos(a)*L,sy0+Math.sin(a)*L); ctx.stroke();
  ctx.beginPath(); ctx.arc(sx0,sy0,L*0.45,a,0); ctx.stroke();
  ctx.fillStyle='#ffb547'; ctx.font='16px '+DISP; ctx.fillText(Math.round(ang)+'°',sx0+L*0.8,sy0-L*0.2);
}

// ---- タップ走（短距離・ハードル・リレー）
function physMetrics(){
  const me=S.runners[ME], D=S.D, fin=me.fin, M={}, h=[], ev=S.ev;
  if(fin==null||fin<=0) return {html:'',m:null};
  const hits=S.cnt.P+S.cnt.G+S.cnt.O; M.tps=+(hits/fin).toFixed(2);
  const sp=S.spl.slice(0,3); while(sp.length<3) sp.push(fin); sp.push(fin);
  M.spl=sp.map((x,i)=>+(x-(i?sp[i-1]:0)).toFixed(2));
  if(S.t80!=null&&fin>S.t80&&S.maxV>0){ M.fade=+Math.max(0,1-(0.2*D/(fin-S.t80))/S.maxV).toFixed(3); }
  if(D>=400&&!ev.leg) M.half=+(sp[1]/fin).toFixed(3);
  if(S.errs.length){ M.err=Math.round(avgOf(S.errs.map(Math.abs))*1000); M.bias=Math.round(avgOf(S.errs)*1000); }
  M.react=me.rt;
  const gs=S.gates.filter(g=>g.done);
  const gH=gs.filter(g=>g.kind==='H'), gB=gs.filter(g=>g.kind==='B');
  if(gH.length){ const e=gH.filter(g=>g.err!=null).map(g=>g.err); M.jerr=e.length?Math.round(avgOf(e.map(Math.abs))*1000):null;
    const k=gH.filter(g=>g.vb&&g.va).map(g=>g.va/g.vb); if(k.length) M.keep=+avgOf(k).toFixed(3); M.hmiss=gH.filter(g=>g.res==='M').length; }
  if(gB.length){ const e=gB.filter(g=>g.err!=null).map(g=>g.err); M.berr=e.length?Math.round(avgOf(e.map(Math.abs))*1000):null;
    const k=gB.filter(g=>g.vb&&g.va).map(g=>g.va/g.vb); if(k.length) M.keep=+avgOf(k).toFixed(3); }
  const lab=ev.leg?'走者別':'¼ごと';
  h.push(mm('秒間タップ',M.tps.toFixed(1)+'回'));
  if(M.err!=null) h.push(mm('タップのズレ',M.err+'ms'+(Math.abs(M.bias)>=5?'（'+tmark(M.bias)+'）':'')));
  h.push(mm('区間 '+lab,M.spl.map(x=>x.toFixed(2)).join(' / ')));
  if(M.fade!=null) h.push(mm('終盤の失速',(M.fade*100).toFixed(1)+'%'));
  if(M.half!=null) h.push(mm('前半の割合',(M.half*100).toFixed(1)+'%（50%＝イーブン）'));
  if(gH.length){ h.push(mm('JUMPのズレ',M.jerr!=null?M.jerr+'ms':'-')); if(M.keep!=null) h.push(mm('ハードル後の速度維持',(M.keep*100).toFixed(0)+'%')); }
  if(gB.length){ h.push(mm('BATONのズレ',M.berr!=null?M.berr+'ms':'-')); if(M.keep!=null) h.push(mm('受け渡し後の速度維持',(M.keep*100).toFixed(0)+'%')); }
  return {html:h.join(''),m:M};
}

// ---- ペース配分走
function distMetrics(){
  const me=S.runners[ME], sim=S.sim, P=sim.P, d=S.dm, M={}, h=[], fin=me.fin;
  if(fin==null||fin<=0) return {html:'',m:null};
  const sp=d.spl.slice(0,3); while(sp.length<3) sp.push(fin); sp.push(fin);
  M.spl=sp.map((x,i)=>+(x-(i?sp[i-1]:0)).toFixed(1));
  if(d.n) M.dev=+(d.dev/d.n).toFixed(3);
  if(d.rn) M.rash=+(d.rash/d.rn).toFixed(3);
  if(d.t90!=null&&fin>d.t90){ M.kick=+(((0.1*S.D)/(fin-d.t90))/(S.D/fin)-1).toFixed(3); M.w90=+Math.max(0,d.w90).toFixed(3); }
  M.wEnd=+Math.max(0,sim.W/P.W).toFixed(3); M.wMin=+Math.max(0,S.minW/P.W).toFixed(3);
  const gs=S.gates.filter(g=>g.done);
  if(gs.length){ const e=gs.filter(g=>g.err!=null).map(g=>g.err); M.jerr=e.length?Math.round(avgOf(e.map(Math.abs))*1000):null; M.gmiss=gs.filter(g=>g.res==='M').length; }
  if(S.ev.walk) M.cards=sim.cards;
  const f=x=>sgn(x*100,1)+'%';
  if(M.dev!=null) h.push(mm('ペースの乱れ',(M.dev*100).toFixed(1)+'%'));
  if(M.rash!=null) h.push(mm('序盤の突っ込み',f(M.rash)));
  h.push(mm('区間 '+(S.ev.legs?'走者別':'¼ごと'),M.spl.map(x=>S.ev.D>=3000?fmtTime(x):x.toFixed(1)).join(' / ')));
  if(M.kick!=null) h.push(mm('ラスト10%の速さ',f(M.kick)+'（平均比）'),mm('その時の余力',(M.w90*100).toFixed(0)+'%'));
  h.push(mm('ゴール時の余力',(M.wEnd*100).toFixed(0)+'%'),mm('最小の余力',(M.wMin*100).toFixed(0)+'%'));
  if(gs.length) h.push(mm(S.ev.water?'障害・水濠JUMPのズレ':'BATONのズレ',M.jerr!=null?M.jerr+'ms':'-'));
  if(S.ev.walk) h.push(mm('警告',M.cards+'枚'));
  return {html:h.join(''),m:M};
}

// ---- 跳躍・投てき
function fieldMetrics(){
  const ev=S.ev, id=ev.baseId||ev.id, A=S.am, M={}, h=[], throws=S.fk==='throw';
  if(!A.length) return {html:'',m:null};
  const runs=A.map(a=>a.run); M.run=+avgOf(runs).toFixed(3);
  M.foul=A.filter(a=>a.foul).length; M.n=A.length;
  const kinds={}; A.forEach(a=>{ for(const k in a.rerr){ if(a.rerr[k]!=null) (kinds[k]=kinds[k]||[]).push(a.rerr[k]); } });
  M.err={}; for(const k in kinds) if(k!=='ang') M.err[k]=Math.round(avgOf(kinds[k].map(Math.abs))*1000);
  M.bias={}; for(const k in kinds) M.bias[k]=Math.round(avgOf(kinds[k])*1000);
  h.push(mm('助走リズム',(M.run*100).toFixed(0)+'%'));
  if(id==='HT'){ M.turn=+avgOf(A.map(a=>a.runHit)).toFixed(1); h.push(mm('回転の成功',M.turn.toFixed(1)+'/'+(S.rings.filter(r=>r.k==='run').length)+'回転')); }
  const lab=S.rlab;
  for(const k in kinds){
    if(k==='ang') continue;
    if(k==='take'&&S.fk==='horiz'){ const fs=A.filter(a=>a.takeF!=null&&!a.line).map(a=>-a.takeF); M.lineFoul=A.filter(a=>a.line).length;
      if(fs.length){ M.takeCm=Math.round(avgOf(fs)*100); h.push(mm('踏切線の手前',M.takeCm+'cm（その分ロス）')); }
      h.push(mm('踏切線ファウル',M.lineFoul+'回')); }
    else if(k==='take'&&!throws){ const cm=Math.round(avgOf(kinds[k].map(x=>Math.abs(x)))*1000);   // 約10m/sで進む想定: 1ms≒1cm
      const b=Math.round(avgOf(kinds[k])*1000); M.takeCm=cm; h.push(mm('踏切の位置ずれ',cm+'cm'+(Math.abs(b)>=5?'（'+(b<0?'手前':'超え気味')+'）':''))); }
    else h.push(mm((lab[k]||k)+'のズレ',M.err[k]+'ms'+(Math.abs(M.bias[k])>=5?'（'+(M.bias[k]<0?'早め':'遅め')+'）':'')));
  }
  const angs=A.map(a=>a.ang).filter(x=>x!=null);
  if(angs.length&&ANG_OPT[id]!=null){ M.ang=+avgOf(angs).toFixed(1); const af=A.filter(a=>a.ang!=null).map(a=>a.angF); M.angF=+avgOf(af).toFixed(3);
    h.push(mm((throws?'射出角':'踏切角')+'（目安'+ANG_OPT[id]+'°）','平均'+M.ang.toFixed(0)+'°'),mm('角度による記録の増減',(M.angF>=0.9995?'±0':'−'+((1-M.angF)*100).toFixed(1))+'%')); }
  const ws=A.map(a=>a.wind).filter(x=>x); if(ws.length){ M.wind=+avgOf(ws).toFixed(1); h.push(mm('風（平均）',(M.wind>0?'+':'')+M.wind.toFixed(1)+'m/s')); }
  h.push(mm('ファウル',M.foul+'/'+M.n+'回'));
  return {html:h.join(''),m:M};
}

function roundsOfTier(ev,t){
  if(ev.eng==='combo'||ev.eng==='field') return [R_F];
  if(ev.rd==='sprint') return t===0?[R_HEAT,R_F]:t<3?[R_HEAT,R_SF,R_F]:[R_HEAT,R_QF,R_SF,R_F];
  if(ev.rd==='mid') return t===0?[R_F]:t<3?[R_HEAT,R_F]:[R_HEAT,R_SF,R_F];
  return [R_F];
}
const engKind=ev=>ev.eng==='phys'?'phys':ev.eng==='dist'?'dist':'field';
function openTier(i){
  RUN.cup=i; RUN.ri=0; RUN.combo=null;
  if(RUN.ev.eng==='combo'){
    const looks=[]; for(let k=0;k<LANES;k++) looks.push(makeLook(k,k===ME,!!RUN.ev.hep));
    RUN.combo={idx:0,tot:Array(LANES).fill(0),parts:Array.from({length:LANES},()=>[]),
      persist:{names:shuffle([...POOLS[TIERS[i].pool]]).slice(0,7),spreads:shuffle([0,1,2,3,4,5,6].map(j=>j/6*0.055)),looks},tp:0};
  }
  prepareRound(); go('scRace');
}
function buildEntries(ev,tier,left,persist){
  const names=persist?persist.names:shuffle([...POOLS[TIERS[tier].pool]]).slice(0,7);
  const opp=makeOpponents(ev,tier,left,names,persist?persist.spreads:undefined);
  const out=[]; let k=0;
  for(let i=0;i<LANES;i++){
    const look=persist?persist.looks[i]:makeLook(i,i===ME,ev.id==='100mH');
    if(i===ME){ out.push({name:'あなた',me:true,look}); continue; }
    const o=opp[k++]; o.look=look; out.push(o);
  }
  return out;
}
function roundLabel(){
  const r=RUN.rounds[RUN.ri];

function concludeRace(info){
  if(RUN.ev.eng==='combo') return comboConclude(info);
  const ev=RUN.ev, r=RUN.rounds[RUN.ri], isFinal=r===R_F;
  const rk=info.rk, pos=rk.findIndex(x=>x.me)+1, me=rk[pos-1], mv=me.val;

  pushLog(ev,pos,mv,info.metrics);
  const gainTP=tpFor(pos,info.cnt,isFinal); SAVE.tp+=gainTP; persist();
  const opened=wasLocked&&unlocked(ev,RUN.cup+1);

  $('rBadges').innerHTML=`<span class="badge tp2">+${gainTP} TP</span>`+(newPb?'<span class="badge pb">自己ベスト</span>':'')+(info.legal?'':'<span class="badge ng">追い風参考</span>')+(sp?`<span class="badge sp">スポンサー契約！${sp.co}「${sp.item}」</span>`:'')+(opened?`<span class="badge un">${TIERS[RUN.cup+1].name} 解放</span>`:'');
  $('rList').innerHTML=rk.map((x,i)=>{

  }).join('');
  $('rMini').innerHTML=(info.mini||'')+(info.metrics?'<button id="rLog" class="ghostbtn">計測ログをコピー</button>':'');
  if(info.metrics) $('rLog').onclick=()=>copyLog(ev);
  const B=$('rBtns'); B.innerHTML='';
  const goTiers=()=>{ S=null; go('scTiers'); };
  if(!isFinal&&ok){ B.append(btn('大会一覧',goTiers), btn(nextName()+'へ',()=>{ RUN.ri++; prepareRound(); },true)); }
  else if(!isFinal){ B.append(btn('大会一覧',goTiers), btn('予選から',()=>{ RUN.ri=0; prepareRound(); }), btn('この組で再挑戦',reIntro,true)); }
  else {
    const hasNext=RUN.cup+1<TIERS.length&&unlocked(ev,RUN.cup+1);
    B.append(btn('大会一覧',goTiers), btn(ev.eng==='field'?'もう一度':'決勝をもう一度',reIntro,!hasNext));
    if(hasNext) B.append(btn('次の大会へ',()=>openTier(RUN.cup+1),true));
  }
  $('result').hidden=false;
  if(isFinal&&pos===1&&mv!=null){ fanfare(); spawnConfetti(); }
  else if(ok||(isFinal&&pos<=3&&mv!=null)) beep(1320,.2,.04,'triangle');
}

// ---- 混成競技
function comboConclude(info){
  const ev=RUN.ev, c=RUN.combo, sub=c.sub, last=c.idx+1>=ev.list.length;
  const vals=Array(LANES).fill(null), by=Array(LANES).fill(null);
  info.rk.forEach(x=>{ vals[x.lane-1]=x.val; by[x.lane-1]=x; });
  const pts=vals.map(v=>v==null?0:comboPoints(ev,sub.baseId,v));
  pts.forEach((p,i)=>{ c.tot[i]+=p; c.parts[i].push(p); });
  const sp=info.rk.findIndex(x=>x.me)+1, gainTP=tpFor(sp,info.cnt,false)+(last?0:0); SAVE.tp+=gainTP; c.tp+=gainTP;
  const order=[...Array(LANES).keys()].sort((a,b)=>c.tot[b]-c.tot[a]||a-b), pos=order.indexOf(ME)+1;
  let opened=false,newPb=false;
  if(last){
    const sv=evSave(ev.id), wasLocked=RUN.cup+1<TIERS.length&&!unlocked(ev,RUN.cup+1);
    if(better(ev,c.tot[ME],sv.pb[RUN.cup])){ sv.pb[RUN.cup]=c.tot[ME]; newPb=true; }
    if(sv.pos[RUN.cup]==null||pos<sv.pos[RUN.cup]) sv.pos[RUN.cup]=pos;
    const bonus=10+(pos<=3?(4-pos)*5:0)+RUN.cup*3; SAVE.tp+=bonus; c.tp+=bonus;
    opened=wasLocked&&unlocked(ev,RUN.cup+1);
    if(pos===1) c.sp=sponsorCheck(RUN.cup);
  }
  pushLog(ev,sp,vals[ME],info.metrics,sub.baseId);
  persist();
  $('rCup').textContent=TIERS[RUN.cup].name+' / '+ev.name+(last?'　最終結果':`　${sub.comboName}の結果`);
  $('rPos').innerHTML=last&&pos===1?'<em>優勝</em>':`${pos}<em style="font-size:.6em">位</em>`;
  $('rTime').textContent=c.tot[ME]+'点';
  const st=$('rStatus');
  if(last){ st.textContent=pos<=3?['金メダル','銀メダル','銅メダル'][pos-1]+'獲得！':'メダルに届かず'; st.className='status '+(pos<=3?'gold':'out'); }
  else { st.textContent=`${sub.comboName}　${valText(sub,by[ME],false)}　${pts[ME]}点`; st.className='status ok'; }
  $('rBadges').innerHTML=`<span class="badge tp2">+${last?c.tp:gainTP} TP</span>`+(newPb?'<span class="badge pb">自己ベスト</span>':'')+(last&&c.sp?`<span class="badge sp">スポンサー契約！${c.sp.co}「${c.sp.item}」</span>`:'')+(opened?`<span class="badge un">${TIERS[RUN.cup+1].name} 解放</span>`:'');
  $('rList').innerHTML=order.map((i,k)=>{
    const x=by[i], cut=last&&k===2;
    return `<tr class="${i===ME?'me':''}${cut?' cut':''}"><td class="ln">${k+1}</td><td class="nm"><span class="sw" style="background:${JERSEY[i]}"></span>${i===ME?'あなた':x.name}</td><td class="t">${valText(sub,x,false)}</td><td class="pts">${pts[i]}→${c.tot[i]}</td></tr>`;
  }).join('');
  let cm='';
  if(last){ const my=c.parts[ME], n=my.length, mean=my.reduce((a,b)=>a+b,0)/n, sd=Math.sqrt(my.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n);
    let lo=0,hi=0; my.forEach((v,i)=>{ if(v<my[lo]) lo=i; if(v>my[hi]) hi=i; });
    const nm=i=>subEvent(ev,i).comboName;
    cm=`<div class="tryline"><span>最高<b class="best">${nm(hi)} ${my[hi]}点</b></span><span>最低<b class="f">${nm(lo)} ${my[lo]}点</b></span><span>ばらつき<b>σ${Math.round(sd)}点（平均${Math.round(mean)}）</b></span><span>安定感<b>${Math.round(my[lo]/mean*100)}%</b></span></div>`
      +`<div class="tryline">${my.map((v,i)=>`<span>${nm(i)}<b>${v}</b></span>`).join('')}</div>`; }
  $('rMini').innerHTML=cm+(info.mini||'')+(info.metrics?'<button id="rLog" class="ghostbtn">計測ログをコピー</button>':'');
  if(info.metrics) $('rLog').onclick=()=>copyLog(ev);
  const B=$('rBtns'); B.innerHTML='';
  const goTiers=()=>{ S=null; go('scTiers'); };
  if(!last) B.append(btn('途中でやめる',goTiers), btn(`次：${subEvent(ev,c.idx+1).comboName}`,()=>{ c.idx++; prepareRound(); },true));
  else {
    const hasNext=RUN.cup+1<TIERS.length&&unlocked(ev,RUN.cup+1);
    B.append(btn('大会一覧',goTiers), btn('もう一度',()=>openTier(RUN.cup),!hasNext));
    if(hasNext) B.append(btn('次の大会へ',()=>openTier(RUN.cup+1),true));
  }
  $('result').hidden=false;
  if(last&&pos===1){ fanfare(); spawnConfetti(); } else if(last&&pos<=3) beep(1320,.2,.04,'triangle');
}

renderMenu(); requestAnimationFrame(loop);

})();
</script>
</body>
</html>
