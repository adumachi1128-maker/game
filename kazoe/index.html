<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かぞえ合戦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{
  color-scheme: light;
  --ink:#16223a; --blue:#2d6ff2; --red:#e8453c; --gold:#ffc93c; --green:#2fcf6f; --paper:#fffaf0;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;box-sizing:border-box;margin:0;background:#10223a;color:#fff;
  font-family:"M PLUS Rounded 1c",system-ui,sans-serif;
  padding-block:12px;padding-inline:16px;display:flex;justify-content:center;overflow:hidden}
#stage{position:relative;width:100%;max-width:1100px;height:100%;border-radius:18px;overflow:hidden;
  background:#8fdcf2;touch-action:none;user-select:none;-webkit-user-select:none}
#stage canvas{display:block;width:100%;height:100%}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(8,40,70,.28) 100%)}
.disp{font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-weight:400}

#hud{position:absolute;inset:10px 10px auto 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.plate{background:rgba(22,34,58,.9);border:2px solid rgba(255,255,255,.14);border-radius:14px;padding:6px 12px;box-shadow:0 4px 0 rgba(0,0,0,.22)}
#lvlBox{display:flex;flex-direction:column;align-items:stretch;gap:6px;width:min(260px,46vw)}
#lvlTxt{font-size:17px;letter-spacing:.08em;text-align:center}
.track{position:relative;height:10px;border-radius:6px;background:#0b1526}
.track i{position:absolute;inset:0 auto 0 0;width:0;border-radius:6px;background:linear-gradient(90deg,#4f8dff,#2d6ff2)}
.track .me{position:absolute;top:50%;left:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#2d6ff2;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.track .boss{position:absolute;top:50%;right:-6px;width:18px;height:18px;margin-top:-9px;border-radius:5px;background:var(--red);border:2px solid #fff;transform:rotate(45deg)}
#right{display:flex;gap:6px;pointer-events:auto}
#coinBox{display:flex;align-items:center;gap:6px;font-size:18px;font-variant-numeric:tabular-nums}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,var(--gold) 50%,#d99a12);box-shadow:inset 0 -2px 0 #b97c05;display:inline-block;flex:none}
#mute{color:#fff;font:800 12px "M PLUS Rounded 1c",sans-serif;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}

.panel{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;width:min(560px,calc(100% - 24px));
  background:linear-gradient(180deg,rgba(28,44,74,.96),rgba(18,28,48,.97));border:2px solid rgba(255,255,255,.12);border-radius:24px;padding:18px 16px 14px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 10px 30px rgba(6,20,40,.35)}
.panel h1{margin:0;font-size:clamp(32px,6.5vw,50px);line-height:1;letter-spacing:.04em;color:#fff;
  text-shadow:0 3px 0 #1d4fb8,0 6px 0 #0d2a66}
.panel h2{margin:0;font-size:clamp(30px,5.5vw,44px);line-height:1.1;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.sub{margin:0;font-size:13px;color:#c9d6ef;text-wrap:balance;max-width:44ch}
.ups{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.up{border:0;border-radius:16px;padding:0 0 9px;background:var(--paper);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;overflow:hidden;font-family:inherit;box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .08s}
.up:hover{transform:translateY(-2px)}
.up:active{transform:translateY(2px)}
.up .tag{width:100%;padding:5px 0;font-size:14px;color:#fff;letter-spacing:.06em}
.up[data-k="u"] .tag{background:var(--blue)} .up[data-k="d"] .tag{background:var(--red)} .up[data-k="c"] .tag{background:#e0a100}
.up .lv{font-size:12px;color:#5a6a88;margin-top:4px}
.up .eff{font-size:15px;font-weight:800}
.up .cost{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.up.poor{opacity:.5;cursor:not-allowed}
.up.poor:hover{transform:none}
.big{border:0;border-radius:18px;background:linear-gradient(180deg,#45e184,#2fcf6f);color:#fff;font-size:22px;padding:11px 42px;cursor:pointer;box-shadow:0 6px 0 #1f8f4b;letter-spacing:.08em;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #1f8f4b}
.hint{margin:0;font-size:12px;color:#9fb0d0}
#resBody{margin:0;font-size:18px;display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap}
#resBody b{font-size:26px;color:var(--gold)}

#toast{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%);font-size:clamp(40px,8vw,72px);pointer-events:none;opacity:0;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
#toast.go{animation:pop .9s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-85%) scale(1)}}
#bonus{position:absolute;left:50%;top:78px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#bonus .t{font-size:clamp(28px,5.5vw,44px);color:var(--gold);-webkit-text-stroke:3px #7a3f00;paint-order:stroke fill;text-shadow:0 4px 0 #7a3f00;animation:throb .5s ease-in-out infinite alternate}
@keyframes throb{to{transform:scale(1.06)}}
#bonus .track{width:180px;height:14px;border:3px solid var(--ink)}
#bonus .track i{background:linear-gradient(90deg,#ffe07a,#ffb300)}
@media (max-width:480px){.up .eff{font-size:13px}.panel{padding:12px}}
@media (prefers-reduced-motion:reduce){#toast.go{animation-duration:.01s}#bonus .t{animation:none}}
#pow{position:absolute;left:10px;top:74px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.chip{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:12px;font-size:15px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.5)}
.chip.rapid{background:#ff7a1a}.chip.spread{background:#9b4dff}
.chip b{font-variant-numeric:tabular-nums;min-width:1.4em;text-align:right}
#evoRow{display:flex;align-items:center;gap:8px;font-size:13px}
#evoName{white-space:nowrap;color:#ffe27a;letter-spacing:.06em}
.track.evo{flex:1;height:8px}
.track.evo i{background:linear-gradient(90deg,#ffe07a,#ffb300)}
#bossBar{position:absolute;left:50%;top:66px;transform:translateX(-50%);width:min(420px,calc(100% - 40px));display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#bossName{font-size:clamp(18px,3.4vw,24px);color:#fff;-webkit-text-stroke:3px #5a0f0b;paint-order:stroke fill;text-shadow:0 3px 0 #5a0f0b;letter-spacing:.06em}
#bossBar .track{width:100%;height:16px;border:3px solid #16223a;background:#3a0d0a}
#bossBar .track i{background:linear-gradient(180deg,#ff8a6a,#e8453c 60%,#b82a22);transition:width .12s}
#bossBar.rage #bossName{color:#ffcf66;animation:throb .35s ease-in-out infinite alternate}
</style>
</head>
<body>
<div id="stage">
  <div id="vig"></div>
  <div id="hud">
    <div id="lvlBox" class="plate"><span id="lvlTxt" class="disp">LEVEL 1</span><div class="track"><i id="barFill"></i><span class="boss"></span><span class="me" id="barMe"></span></div><div id="evoRow"><span id="evoName" class="disp">見習い</span><div class="track evo"><i id="evoFill"></i></div></div></div>
    <div id="right">
      <div id="coinBox" class="plate"><b id="coinTxt" class="disp">0</b><span class="coin"></span></div>
      <button id="mute" class="plate" aria-label="音のオンオフ">音 ON</button>
    </div>
  </div>

  <div id="home" class="panel">
    <h1 class="disp">かぞえ合戦</h1>
    <p class="sub">ゲートで戦力を上げて仲間（最大4人）を進化させ、罠をかわし、巨大ボスを撃ち倒せ。ボス戦は前後左右に動いて赤い予告エリアから逃げろ。</p>
    <div class="ups">
      <button class="up" data-k="u" id="up-u"><span class="tag disp">仲間</span><span class="lv"></span><span class="eff"></span><span class="cost"></span></button>
      <button class="up" data-k="d" id="up-d"><span class="tag disp">攻撃力</span><span class="lv"></span><span class="eff"></span><span class="cost"></span></button>
      <button class="up" data-k="c" id="up-c"><span class="tag disp">コイン</span><span class="lv"></span><span class="eff"></span><span class="cost"></span></button>
    </div>
    <button id="startBtn" class="big disp">スタート</button>
    <p class="hint">スペースキーでも開始 ／ ドラッグか ← → で移動（ボス戦は ↑ ↓ で前後にも）</p>
  </div>

  <div id="result" class="panel" hidden>
    <h2 id="resTitle" class="disp"></h2>
    <p id="resBody"></p>
    <button id="resBtn" class="big disp">次へ</button>
  </div>

  <div id="toast" class="disp"></div>
  <div id="pow"></div>
  <div id="bossBar" hidden><span id="bossName" class="disp"></span><div class="track"><i id="bossFill"></i></div></div>
  <div id="bonus" hidden><span class="t disp">BONUS TIME</span><div class="track"><i id="bonusFill"></i></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const stage = $('#stage');
const KEY = 'kazoe-gassen-v1';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- save data ---------- */
const save = { coins: 100, level: 1, u: 1, d: 1, c: 1 };
try { Object.assign(save, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };
const slots = () => clamp(save.u, 1, 4);
const startN = () => 6 + (slots() - 1) * 4;
const dmg = () => 1 + (save.d - 1) * 0.5;
const coinMul = () => 1 + (save.c - 1) * 0.3;
const cost = lv => Math.round(40 * Math.pow(1.5, lv - 1));

/* ---------- sound ---------- */
let AC = null, muted = false, lastPop = 0;
function beep(f = 600, d = .08, type = 'square', v = .04) {
  if (muted || !AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d);
  o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
}
function popSound() { const n = performance.now(); if (n - lastPop > 70) { lastPop = n; beep(260 + Math.random() * 120, .05, 'triangle', .03); } }
$('#mute').onclick = () => { muted = !muted; $('#mute').textContent = muted ? '音 OFF' : '音 ON'; };

/* ---------- three setup ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const HORIZON = new THREE.Color('#c6f0fb');
scene.fog = new THREE.Fog(HORIZON, 60, 150);
const camera = new THREE.PerspectiveCamera(55, 1, .1, 400);
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = w / h < .8 ? 72 : 55; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

const hemi = new THREE.HemisphereLight('#e6f8ff', '#f2c79a', .62); scene.add(hemi);
scene.add(new THREE.AmbientLight('#ffffff', .12));
const sun = new THREE.DirectionalLight('#fff0d4', .95);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 22, bottom: -22, near: 1, far: 80 });
sun.shadow.bias = -.0006; sun.shadow.normalBias = .03;
scene.add(sun); scene.add(sun.target);

const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .82, flatShading: true }, o));
const MS = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .55 }, o));
const dummy = new THREE.Object3D();
const rng = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const TIME = { value: 0 };
const shadowAll = o => o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });

/* ---------- sky & ground ---------- */
const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 24, 12), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color('#3fb4ea') }, hor: { value: HORIZON } },
  vertexShader: 'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: 'uniform vec3 top;uniform vec3 hor;varying vec3 vP;void main(){float h=clamp(vP.y*1.8,0.,1.);gl_FragColor=vec4(mix(hor,top,pow(h,.65)),1.);}'
}));
sky.renderOrder = -1; scene.add(sky);

const water = new THREE.Mesh(new THREE.PlaneGeometry(700, 700), new THREE.ShaderMaterial({
  fog: false,
  uniforms: { t: TIME, fogC: { value: HORIZON }, camP: { value: new THREE.Vector3() }, fogF: { value: 150 }, mode: { value: 0 }, cA: { value: new THREE.Color() }, cB: { value: new THREE.Color() }, cC: { value: new THREE.Color() } },
  vertexShader: 'varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',
  fragmentShader: `uniform float t;uniform float mode;uniform float fogF;uniform vec3 fogC;uniform vec3 camP;uniform vec3 cA;uniform vec3 cB;uniform vec3 cC;varying vec3 vW;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
  void main(){vec2 p=vW.xz;vec3 c;
   if(mode<.5){
     vec2 g=abs(fract(p/26.)-.5)*26.;float m=min(g.x,g.y);
     c=mix(cA,cB,n(p*.12)*.7);
     c=mix(c,cC,step(m,3.2));
     c=mix(c,vec3(.93,.93,.9),step(3.2,m)*step(m,3.9));
     float dash=step(.5,fract((g.x<g.y?p.y:p.x)*.12))*step(m,.18);
     c=mix(c,vec3(.98,.85,.3),dash*.9);
   } else if(mode<1.5){
     float a=n(p*.07)+n(p*.19+vec2(t*.04,0.))*.5;
     float crack=1.-smoothstep(0.,.07,abs(fract(a*2.2)-.5));
     c=mix(cA,cB,n(p*.4));
     vec3 lava=mix(vec3(1.,.28,.04),vec3(1.,.78,.2),.5+.5*sin(t*2.+a*12.));
     c=mix(c,lava,crack);
     c+=vec3(.25,.05,0.)*crack*crack;
   } else {
     float a=n(p*.05)*.6+n(p*.22)*.4;
     c=mix(cA,cB,a);
     c=mix(c,cC,smoothstep(.66,.72,n(p*.06+3.)));
   }
   float d=distance(vW,camP);
   c=mix(c,fogC,smoothstep(45.,fogF,d));
   gl_FragColor=vec4(c,1.);}`
}));
water.rotation.x = -Math.PI / 2; water.position.y = -1.6; scene.add(water);

/* ---------- bridge (materials swapped per biome) ---------- */
const WORLD_LEN = 800;
function mkTex(draw) {
  const c = document.createElement('canvas'); c.width = c.height = 256; draw(c.getContext('2d'), rng(7));
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, WORLD_LEN / 9);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
}
const plankT = mkTex((x, r) => {
  x.fillStyle = '#b77a45'; x.fillRect(0, 0, 256, 256);
  for (let row = 0; row < 8; row++) {
    let cx = -r() * 120;
    while (cx < 256) {
      const w = 110 + r() * 90, l = 60 + r() * 9;
      x.fillStyle = `hsl(${24 + r() * 7},${55 + r() * 10}%,${l}%)`;
      x.fillRect(cx + 2, row * 32 + 2, w - 4, 28);
      x.fillStyle = 'rgba(255,255,255,.18)'; x.fillRect(cx + 2, row * 32 + 2, w - 4, 4);
      x.fillStyle = 'rgba(120,70,30,.14)';
      for (let g = 0; g < 3; g++) x.fillRect(cx + 10 + r() * (w - 30), row * 32 + 8 + r() * 16, 20 + r() * 40, 1.5);
      x.fillStyle = '#8a5a30';
      x.fillRect(cx + 8, row * 32 + 14, 3, 3); x.fillRect(cx + w - 12, row * 32 + 14, 3, 3);
      cx += w;
    }
  }
  // light snow dusting at the edges
  x.fillStyle = 'rgba(255,255,255,.55)';
  for (let i = 0; i < 260; i++) { const e = r() < .5 ? r() * 26 : 256 - r() * 26; x.fillRect(e, r() * 256, 2 + r() * 5, 2 + r() * 3); }
});
const roadT = mkTex((x, r) => {
  x.fillStyle = '#4b505b'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1400; i++) { x.fillStyle = `rgba(${r() < .5 ? '255,255,255' : '0,0,0'},${.04 + r() * .06})`; x.fillRect(r() * 256, r() * 256, 2, 2); }
  x.fillStyle = '#f2f2f2'; x.fillRect(10, 0, 7, 256); x.fillRect(239, 0, 7, 256);
  for (const lx of [83, 168]) { x.fillRect(lx, 20, 5, 88); x.fillRect(lx, 148, 5, 88); }
});
const basaltT = mkTex((x, r) => {
  x.fillStyle = '#e0561a'; x.fillRect(0, 0, 256, 256);
  for (let row = 0; row < 4; row++) {
    let cx = -r() * 60;
    while (cx < 256) {
      const w = 48 + r() * 44;
      x.fillStyle = `hsl(${8 + r() * 12},${8 + r() * 8}%,${17 + r() * 10}%)`; x.fillRect(cx + 3, row * 64 + 3, w - 6, 58);
      x.fillStyle = 'rgba(255,255,255,.07)'; x.fillRect(cx + 3, row * 64 + 3, w - 6, 7);
      cx += w;
    }
  }
});
const deckTopM = new THREE.MeshStandardMaterial({ map: plankT, roughness: .9 }), deckSideM = M('#b77a45'), deckEdgeM = M('#8a5a30');
const beamM = M('#9a6236'), railM = M('#e1a66c'), postMat = M('#e8ab70'), capMat = M('#f6c692'), pierM = M('#8f5a31');
const deck = new THREE.Mesh(new THREE.BoxGeometry(9.2, .6, WORLD_LEN), [deckSideM, deckSideM, deckTopM, deckEdgeM, deckSideM, deckSideM]);
deck.position.set(0, -.3, 30 - WORLD_LEN / 2); deck.receiveShadow = true; scene.add(deck);
for (const s of [-1, 1]) {
  const beam = new THREE.Mesh(new THREE.BoxGeometry(.5, .75, WORLD_LEN), beamM);
  beam.position.set(s * 4.7, -.35, 30 - WORLD_LEN / 2); beam.receiveShadow = true; scene.add(beam);
  const rail = new THREE.Mesh(new THREE.BoxGeometry(.22, .18, WORLD_LEN), railM);
  rail.position.set(s * 4.7, .62, 30 - WORLD_LEN / 2); rail.castShadow = true; scene.add(rail);
}
{
  const nPost = Math.floor(WORLD_LEN / 6);
  const posts = new THREE.InstancedMesh(new THREE.CylinderGeometry(.4, .46, 1.2, 8), postMat, nPost * 2);
  const caps = new THREE.InstancedMesh(new THREE.CylinderGeometry(.48, .44, .18, 8), capMat, nPost * 2);
  let k = 0;
  for (let i = 0; i < nPost; i++) for (const s of [-1, 1]) {
    dummy.position.set(s * 4.7, .3, 30 - i * 6); dummy.updateMatrix(); posts.setMatrixAt(k, dummy.matrix);
    dummy.position.y = .95; dummy.updateMatrix(); caps.setMatrixAt(k++, dummy.matrix);
  }
  posts.castShadow = true; scene.add(posts); scene.add(caps);
  const nP = Math.floor(WORLD_LEN / 16);
  const piers = new THREE.InstancedMesh(new THREE.CylinderGeometry(.55, .65, 2.4, 8), pierM, nP * 2);
  k = 0;
  for (let i = 0; i < nP; i++) for (const s of [-1, 1]) { dummy.position.set(s * 3.6, -1.6, 20 - i * 16); dummy.updateMatrix(); piers.setMatrixAt(k++, dummy.matrix); }
  scene.add(piers);
}

/* ---------- biomes: city / volcano / mountain ---------- */

    if (x.life <= 0) { scene.remove(x.m); x.m.material.dispose(); if (x.e) x.e.material.dispose(); G.teles.splice(i, 1); }
  }
  for (let i = G.props.length - 1; i >= 0; i--) {
    const p = G.props[i]; p.t += dt;
    p.m.position.y = p.t < .12 ? -1 + p.t / .12 * 1.6 : p.t > p.dur - .35 ? .6 - (p.t - (p.dur - .35)) / .35 * 1.8 : .6;
    if (p.t >= p.dur) { scene.remove(p.m); G.props.splice(i, 1); }
  }
  /* ----- visuals ----- */
  const moving = (G.phase === 'run' && !G.fight) || (G.phase === 'boss' && (keys.l || keys.r || keys.fw || keys.bk || !!drag));
  const lerp = Math.min(1, dt * 8), sc = sqScale(), F = FORM[Math.max(1, G.m)];
  SQ.forEach((u, i) => {
    const on = i < G.m && G.n > 0; u.g.visible = on; if (!on) return;
    u.x += (F[i][0] * sc - u.x) * lerp; u.z += (F[i][1] * sc - u.z) * lerp; u.s = Math.min(1, u.s + dt * 3); u.pop = Math.max(0, u.pop - dt * 2.2);
    const ph = G.t * 12 + i * 1.7;
    const bob = moving ? Math.abs(Math.sin(ph)) * .09 : (G.fight ? Math.abs(Math.sin(ph * 1.6)) * .06 : Math.abs(Math.sin(G.t * 3 + i)) * .025);
    const sw = moving ? Math.sin(ph) * .75 : 0, k = (u.s < 1 ? u.s * (1.3 - .3 * u.s) : 1) * (1 + Math.sin(u.pop * Math.PI) * .35);
    u.g.position.set(G.px + u.x, bob * sc, G.pz + u.z); u.g.scale.setScalar(sc * k); u.g.rotation.x = moving ? -.14 : 0;
    u.legs[0].rotation.x = sw; u.legs[1].rotation.x = -sw;
    u.cape.rotation.x = .2 + (moving ? .45 + Math.sin(ph) * .12 : 0);
    if (u.aura.visible) { const a = .5 + .5 * Math.sin(G.t * 4 + i); u.aura.material.opacity = .25 + a * .35; u.aura.scale.setScalar(1 + a * .25); u.aura.position.y = .02 - bob; }
    if (u.halo.visible) u.halo.rotation.y += dt * 2;
  });
  for (let i = G.fallers.length - 1; i >= 0; i--) {
    const f = G.fallers[i]; f.vy -= 16 * dt; f.m.position.y += f.vy * dt; f.m.rotation.x += dt * 5; f.m.rotation.z += dt * 3;
    if (f.m.position.y < -3.2) { spawnFx(f.m.position.x, -1.4, f.m.position.z, '#e8fbff', 5, 3); scene.remove(f.m); G.fallers.splice(i, 1); }
  }
  const dd = dims();
  pDisk.scale.set(dd.hw * 2.6 + .6, 1, dd.hd * 2.6 + .6); pDisk.position.set(G.px, .02, G.pz); pDisk.visible = G.n > 0;
  pLabel.position.set(G.px, 1.25 * sc + .55, G.pz + .1);
  pLabel.userData.set(G.n, '#2459d6'); pLabel.visible = G.n > 0;
  {
    const T = TIERS[G.tier], N = TIERS[G.tier + 1], nm = T.name + (N ? '' : ' MAX');
    if ($('#evoName').textContent !== nm) $('#evoName').textContent = nm;
    $('#evoFill').style.width = (N ? clamp((G.n - T.at) / (N.at - T.at), 0, 1) * 100 : 100) + '%';
  }

  red.begin();
  for (const e of G.ens) {
    const vis = !(e.z > G.pz + 15 || e.z < G.pz - 95);
    e.label.visible = e.disk.visible = vis; if (!vis) continue;
    const m = Math.min(e.n, 150);
    for (let i = 0; i < m; i++) {
      const rr2 = .3 * Math.sqrt(i + .3), a = i * 2.39996, ph = G.t * 13 + i * 1.3;
      const run = e.charging && !(G.fight && G.fight.o === e);
      red.add(e.x + Math.cos(a) * rr2, run ? Math.abs(Math.sin(ph)) * .09 : Math.abs(Math.sin(G.t * 2.5 + i)) * .02, e.z + Math.sin(a) * rr2, Math.PI, run ? -.14 : 0, run ? Math.sin(ph) * .75 : 0, 1);
    }
    const er = .3 * Math.sqrt(m) + .3;
    e.disk.scale.set(er * 2.6 + .6, 1, er * 2.6 + .6); e.disk.position.set(e.x, .02, e.z);
    e.label.position.set(e.x, 1.45 + Math.sqrt(m) * .03, e.z); e.label.userData.set(e.n, '#c92f27');
  }
  red.end();


  bCore.count = bGlow.count = Math.min(G.bullets.length, 320);
  for (let i = 0; i < bCore.count; i++) {
    const b = G.bullets[i];
    dummy.position.set(b.x, .47 * sc, b.z); dummy.rotation.set(0, Math.atan2(-b.vx, 34), 0); dummy.scale.set(1, 1, 4); dummy.updateMatrix(); bCore.setMatrixAt(i, dummy.matrix);
    dummy.scale.set(1, 1, 4.5); dummy.updateMatrix(); bGlow.setMatrixAt(i, dummy.matrix);
  }
  dummy.scale.set(1, 1, 1); dummy.rotation.set(0, 0, 0);
  bCore.instanceMatrix.needsUpdate = bGlow.instanceMatrix.needsUpdate = true;

  let ci = 0;
  for (const c of G.coins) {
    if (!c.alive || c.z > G.pz + 12 || c.z < G.pz - 90 || ci >= 400) continue;
    dummy.position.set(c.x, .7 + Math.sin(G.t * 4 + c.z) * .1, c.z); dummy.rotation.set(Math.PI / 2, 0, G.t * 4 + c.z); dummy.updateMatrix(); coinMesh.setMatrixAt(ci++, dummy.matrix);
  }
  dummy.rotation.set(0, 0, 0);
  coinMesh.count = ci; coinMesh.instanceMatrix.needsUpdate = true;

  for (let i = G.fx.length - 1; i >= 0; i--) { const f = G.fx[i]; f.life -= dt; f.vy -= f.g * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt; if (f.y < .05 && f.g > 10 && f.y > -1) { f.y = .05; f.vy *= -.3; f.vx *= .6; f.vz *= .6; } if (f.life <= 0) G.fx.splice(i, 1); }
  G.fx.forEach((f, i) => {
    const flat = f.g < 10 && !f.round, s = Math.min(1, f.life * 2.5) * (f.sz || (flat ? 1.4 : 1));
    dummy.position.set(f.x, f.y, f.z); dummy.rotation.set(f.rs + f.life * 9, f.life * 7, 0); dummy.scale.set(s, flat ? s * .3 : s, s); dummy.updateMatrix();
    fxMesh.setMatrixAt(i, dummy.matrix); fxMesh.setColorAt(i, tmpC.set(f.c));
  });
  dummy.rotation.set(0, 0, 0); dummy.scale.set(1, 1, 1);
  fxMesh.count = G.fx.length; fxMesh.instanceMatrix.needsUpdate = true; if (fxMesh.instanceColor) fxMesh.instanceColor.needsUpdate = true;

  for (let i = ringFx.length - 1; i >= 0; i--) {
    const m = ringFx[i]; m.userData.life -= dt; const k = 1 - m.userData.life / .45;
    m.scale.setScalar(.3 + k * m.userData.size); m.material.opacity = .8 * (1 - k);
    if (m.userData.life <= 0) { scene.remove(m); m.material.dispose(); ringFx.splice(i, 1); }
  }
  for (const row of G.rows) for (const g of row.gates) { g.flash = Math.max(0, g.flash - dt * 5); g.panel.material.uniforms.flash.value = Math.min(1, g.flash); if (g.q) g.q.position.y = 3.1 + Math.sin(G.t * 5) * .12; }
  for (const o of G.obs) { o.hit = Math.max(0, o.hit - dt * 8); o.mat.emissive.setRGB(o.hit * .6, o.hit * .5, o.hit * .4); o.grp.scale.set(1 + o.hit * .05, 1 - o.hit * .04, 1 + o.hit * .05); }
  for (const c of G.cages) if (c.alive) { c.hit = Math.max(0, c.hit - dt * 8); c.grp.rotation.z = Math.sin(G.t * 40) * .02 * c.hit; }
  for (const t of G.turrets) if (t.alive) {
    t.hit = Math.max(0, t.hit - dt * 8); t.recoil = Math.max(0, (t.recoil || 0) - dt * 4);
    t.grp.rotation.y = Math.atan2(G.px - t.x, G.pz - t.z) * .6; t.grp.position.z = t.z - t.recoil * .25;
    t.grp.scale.setScalar(1 + t.hit * .06);
  }
  for (const p of G.powers) if (p.alive) { p.grp.rotation.y += dt * 2; p.grp.position.y = 1 + Math.sin(G.t * 3 + p.z) * .15; p.hit = Math.max(0, (p.hit || 0) - dt * 8); p.box.scale.setScalar(1 + p.hit * .15); }
  if (G.chest && G.chest.grp.visible) { G.chest.hit = Math.max(0, (G.chest.hit || 0) - dt * 8); const s = 1 + G.chest.hit * .04; G.chest.grp.scale.set(s, 2 - s, s); G.chest.grp.rotation.y = Math.sin(G.t * 2) * .05; }
  for (const l of labels) { if (l.userData.pop > 0) { l.userData.pop = Math.max(0, l.userData.pop - dt * 5); const k = 1 + l.userData.pop * .3; l.scale.set(l.userData.base[0] * k, l.userData.base[1] * k, 1); } }
  for (const fn of scenAnim) fn(dt);

  const prog = clamp(-G.pz / (-G.bossZ + 4), 0, 1);
  $('#barFill').style.width = prog * 100 + '%'; $('#barMe').style.left = prog * 100 + '%';

  const zoom = Math.min(dd.hd, 6);
  const bossCam = G.phase === 'boss' || (G.boss && G.pz - G.bossZ < 24);
  const tx = G.px * .35, ty = 7 + zoom * .75 + (bossCam ? 2.2 : 0), tz = G.pz + 9 + zoom * .95 + (bossCam ? 1.5 : 0);
  camera.position.x += (tx - camera.position.x) * Math.min(1, dt * 5);
  camera.position.y += (ty - camera.position.y) * Math.min(1, dt * 3);
  camera.position.z += (tz - camera.position.z) * Math.min(1, dt * 6);
  camera.lookAt(G.px * .2, bossCam ? 1.2 : 0, camera.position.z - (bossCam ? 19 : 17) - zoom * .5);
  G.shake = Math.max(0, G.shake - dt * 1.8);
  if (G.shake > 0) { camera.position.x += (Math.random() - .5) * G.shake * .6; camera.position.y += (Math.random() - .5) * G.shake * .6; }
  sky.position.copy(camera.position);
  water.position.x = camera.position.x; water.position.z = camera.position.z - 120;
  water.material.uniforms.camP.value.copy(camera.position);
  sun.position.set(G.px + 9, 22, G.pz + 2); sun.target.position.set(G.px, 0, G.pz - 9);
}

function startBonus() {
  G.phase = 'bonus'; G.bonusT = 6; G.fight = null;
  const z = G.pz - 13, hp = 120 + save.level * 25;
  const grp = new THREE.Group(); grp.position.set(0, 0, z);
  const box = new THREE.Mesh(new THREE.BoxGeometry(5, 2.4, 2.6), chestRedM); box.position.y = 1.2; grp.add(box);
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 5, 14, 1, false, 0, Math.PI), chestRedM); lid.rotation.set(0, 0, Math.PI / 2); lid.position.y = 2.4; grp.add(lid);
  for (const bx of [-2.1, -.6, .6, 2.1]) { const b = new THREE.Mesh(new THREE.BoxGeometry(.3, 2.5, 2.7), goldM); b.position.set(bx, 1.2, 0); grp.add(b); const b2 = new THREE.Mesh(new THREE.CylinderGeometry(1.35, 1.35, .3, 14, 1, false, 0, Math.PI), goldM); b2.rotation.set(0, 0, Math.PI / 2); b2.position.set(bx, 2.4, 0); grp.add(b2); }
  const band = new THREE.Mesh(new THREE.BoxGeometry(5.1, .3, 2.7), goldM); band.position.y = 2.35; grp.add(band);
  const lock = new THREE.Mesh(new THREE.BoxGeometry(.9, 1, .3), goldM); lock.position.set(0, 2.2, 1.35); grp.add(lock);
  shadowAll(grp);
  const label = makeLabel(2.6, 1.3); label.position.set(0, 4.6, 0); grp.add(label);
  label.userData.set('+0', '#9a5400', '#ffe27a');
  lvl.add(grp);
  G.chest = { z, hp, grp, label, hit: 0 };
  $('#bonus').hidden = false; toast('BONUS!', '#ffc93c'); beep(990, .12); setTimeout(() => beep(1320, .15), 100);
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
resetRun(); renderHome();
camera.position.set(0, 9, 11); camera.lookAt(0, 0, -8);
requestAnimationFrame(frame);
})();
</script>
