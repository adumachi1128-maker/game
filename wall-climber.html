<style>

canvas{width:100%;height:100%;display:block}
#ctrl{position:absolute;left:0;right:0;bottom:1.5%;height:19%;display:flex;justify-content:space-between;align-items:center;padding:0 2.5%;pointer-events:none}
.grp{display:flex;gap:6%;width:48%}
.btn{pointer-events:auto;flex:1;aspect-ratio:1;max-height:100%;border-radius:26%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;color:#fff;font-weight:800;font-size:clamp(10px,3vw,15px);letter-spacing:.05em;
  background:radial-gradient(120% 90% at 30% 15%,rgba(255,255,255,.34),rgba(255,255,255,.05) 45%,rgba(0,0,0,.28) 100%),linear-gradient(160deg,rgba(74,98,160,.82),rgba(20,30,66,.9));
  border:1.5px solid rgba(255,255,255,.5);box-shadow:0 6px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -8px 14px rgba(0,0,0,.35);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .06s,filter .06s;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.btn svg{width:42%;height:42%;fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.btn.on{transform:translateY(2px) scale(.95);filter:brightness(1.35)}
.hand{background:radial-gradient(120% 90% at 30% 15%,rgba(255,255,255,.4),rgba(255,255,255,.06) 45%,rgba(0,0,0,.3) 100%),linear-gradient(160deg,rgba(236,92,68,.9),rgba(140,30,24,.92))}
#hL svg{transform:scaleX(-1)}
#game{container-type:inline-size}
.coin{display:inline-block;width:.9em;height:.9em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#f5b820 55%,#b87410);vertical-align:-.12em;margin-right:.3em;box-shadow:0 0 0 1px rgba(120,70,0,.5)}
#shopBtn{position:absolute;left:50%;top:75.4%;transform:translateX(-50%);width:62%;height:4.6%;display:none;border-radius:99px;font:700 3.4cqw/1 system-ui,sans-serif;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,rgba(90,120,200,.9),rgba(30,45,100,.95));border:1.5px solid rgba(255,255,255,.55);box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.5);text-shadow:0 1px 2px rgba(0,0,0,.6)}
#shopBtn:active{filter:brightness(1.25)}
#helpBtn{position:absolute;right:3.5%;top:1.6%;width:9.5cqw;height:9.5cqw;display:none;border-radius:50%;font:900 5.2cqw/1 system-ui,sans-serif;color:#fff;cursor:pointer;z-index:5;background:linear-gradient(180deg,rgba(90,120,200,.95),rgba(30,45,100,.95));border:1.5px solid rgba(255,255,255,.6);box-shadow:0 3px 8px rgba(0,0,0,.45)}
#help{position:absolute;inset:0;z-index:11;background:linear-gradient(180deg,rgba(10,16,40,.98),rgba(4,6,16,.99));color:#fff;overflow-y:auto;touch-action:pan-y;padding:4cqw 5cqw 7cqw;font-family:system-ui,'Hiragino Sans','Noto Sans JP',sans-serif;box-sizing:border-box}
#help[hidden]{display:none}
#help h2{font-size:5.6cqw;font-weight:900;color:#fff3b0;margin:0 0 1cqw}
#help h3{font-size:3.2cqw;letter-spacing:.2em;color:#8fa6c2;margin:5cqw 0 2cqw;font-weight:700}
#help p{font-size:3.4cqw;line-height:1.65;color:#dbe5f3;margin:0 0 1.5cqw}
#help .it{display:flex;gap:3cqw;align-items:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:3cqw;padding:2.6cqw 3cqw;margin-bottom:2cqw}

#help .ic svg{width:8cqw;height:8cqw}
#help .it b{display:block;font-size:3.8cqw;margin-bottom:.6cqw}
#help .it span:not(.tag){display:block;font-size:3.1cqw;line-height:1.55;color:#c3cfe2}
#help .tag{display:inline-block;font-size:2.6cqw;font-weight:800;border-radius:99px;padding:.4cqw 2cqw;margin-left:1.6cqw;vertical-align:.15em}
#help .good{background:rgba(120,230,150,.2);color:#9af0b4}#help .bad{background:rgba(255,120,110,.2);color:#ffb0a8}
#help .step{display:flex;gap:2.4cqw;margin-bottom:1.6cqw;font-size:3.3cqw;line-height:1.55;color:#dbe5f3}
#help .step i{flex:0 0 5.6cqw;height:5.6cqw;border-radius:50%;background:linear-gradient(180deg,#ffb84a,#e2561e);font:800 3.2cqw/5.6cqw system-ui;text-align:center;font-style:normal}
#help .box{background:linear-gradient(180deg,rgba(255,200,60,.16),rgba(255,160,30,.06));border:1px solid rgba(255,210,63,.5);border-radius:3cqw;padding:3cqw}
#help button.hx{display:block;margin:6cqw auto 0;min-width:40cqw;font:700 3.6cqw/1 system-ui,'Hiragino Sans','Noto Sans JP',sans-serif;color:#fff;border:1.5px solid rgba(255,255,255,.5);border-radius:99px;padding:2.4cqw 4cqw;cursor:pointer;background:linear-gradient(180deg,#5a78c8,#2a3f86)}
#shop{position:absolute;inset:0;z-index:10;background:linear-gradient(180deg,rgba(10,16,40,.97),rgba(4,6,16,.98));color:#fff;overflow-y:auto;touch-action:pan-y;padding:4cqw 5cqw 6cqw;font-family:system-ui,'Hiragino Sans','Noto Sans JP',sans-serif;box-sizing:border-box}

#shop button{font:700 3.6cqw/1 system-ui,'Hiragino Sans','Noto Sans JP',sans-serif;color:#fff;border:1.5px solid rgba(255,255,255,.5);border-radius:99px;padding:2.2cqw 4cqw;min-width:20cqw;cursor:pointer;background:linear-gradient(180deg,#ffb84a,#e2561e);text-shadow:0 1px 2px rgba(80,30,0,.7);box-shadow:0 3px 8px rgba(0,0,0,.4)}

.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:3cqw}
.sh-t{font-size:5.6cqw;font-weight:900;color:#fff3b0}
.sh-c{font-size:4.6cqw;font-weight:800;color:#ffd23f;background:rgba(255,255,255,.08);border-radius:99px;padding:1.2cqw 3.4cqw}
.sh-s{font-size:3.2cqw;letter-spacing:.2em;color:#8fa6c2;margin:4cqw 0 2cqw}
.sh-r{display:flex;justify-content:space-between;align-items:center;gap:3cqw;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:3cqw;padding:3cqw 3.4cqw;margin-bottom:2cqw}
.sh-n b{display:block;font-size:3.9cqw}.sh-n span{display:block;font-size:2.9cqw;color:#aab7cc;margin:.6cqw 0 1.4cqw}
.pips{display:flex;gap:1.2cqw}.pips i{width:3.4cqw;height:3.4cqw;border-radius:50%;background:rgba(255,255,255,.15)}.pips i.on{background:linear-gradient(180deg,#ffe27a,#ff9a2a);box-shadow:0 0 6px rgba(255,190,60,.7)}
.sh-g{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw}
.sh-k{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:3cqw;padding:2.6cqw 1.6cqw;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.8cqw}
.sh-k.sel{border-color:#ffd23f;box-shadow:0 0 10px rgba(255,210,63,.4)}
.sh-k b{font-size:3.4cqw}.sh-k .sw{width:11cqw;height:11cqw;border-radius:50%;border:2px solid rgba(255,255,255,.7);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.sh-k button{min-width:0;width:100%;padding:1.8cqw 1cqw;font-size:3.2cqw}
#shop .sh-x{display:block;margin:5cqw auto 0;min-width:40cqw;background:linear-gradient(180deg,#5a78c8,#2a3f86)}
</style>
</head>

/* ================= utils ================= */
function hx(c){c=c.replace('#','');if(c.length===3)c=c.split('').map(v=>v+v).join('');const n=parseInt(c,16);return[(n>>16)&255,(n>>8)&255,n&255]}
const rgba=(r,g,b,a=1)=>`rgba(${r|0},${g|0},${b|0},${a})`;
function lit(c,a){const[r,g,b]=hx(c);return rgba(r+(255-r)*a,g+(255-g)*a,b+(255-b)*a)}
function drk(c,a){const[r,g,b]=hx(c);return rgba(r*(1-a),g*(1-a),b*(1-a))}
function mixc(c1,c2,t){const a=hx(c1),b=hx(c2);return rgba(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t)}
function alp(c,a){const[r,g,b]=hx(c);return rgba(r,g,b,a)}
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function mk(w,h,sc=SC){const c=document.createElement('canvas');c.width=Math.ceil(w*sc);c.height=Math.ceil(h*sc);const x=c.getContext('2d');x.scale(sc,sc);return[c,x]}
function rr(x,y,w,h,r,c=ctx){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wp(c,x,y,w,h,shape){
  c.beginPath();
  if(shape==='arch'){c.moveTo(x,y+h);c.lineTo(x,y+w/2);c.arc(x+w/2,y+w/2,w/2,Math.PI,0);c.lineTo(x+w,y+h);c.closePath()}
  else c.rect(x,y,w,h);
}
function hg(x0,x1,c){const g=ctx.createLinearGradient(x0,0,x1,0);g.addColorStop(0,lit(c,.3));g.addColorStop(.55,c);g.addColorStop(1,drk(c,.34));return g}
function heart(x,y,s,c=ctx){c.beginPath();c.moveTo(x,y+s*.9);c.bezierCurveTo(x-s*1.25,y+s*.1,x-s*.7,y-s*.95,x,y-s*.35);c.bezierCurveTo(x+s*.7,y-s*.95,x+s*1.25,y+s*.1,x,y+s*.9);c.closePath()}
function starPath(cx,cy,r,c=ctx){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.45:r;c.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad)}c.closePath()}

const SHARED={};
function glowSprite(col){
  const k='g'+col;if(SHARED[k])return SHARED[k];
  const[c,x]=mk(64,64,1);const g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,alp(col,.95));g.addColorStop(.35,alp(col,.35));g.addColorStop(1,alp(col,0));
  x.fillStyle=g;x.fillRect(0,0,64,64);return SHARED[k]=c;
}
function vignette(){
  if(SHARED.vig)return SHARED.vig;
  const[c,x]=mk(W,H,1);const g=x.createRadialGradient(W/2,H*.48,H*.28,W/2,H*.48,H*.78);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,12,.5)');x.fillStyle=g;x.fillRect(0,0,W,H);return SHARED.vig=c;
}
function cloudSprite(){
  if(SHARED.cloud)return SHARED.cloud;
  const[c,x]=mk(170,70,1);const R=rng(5);
  for(let i=0;i<14;i++){
    const cx=25+R()*120,cy=38+R()*10-Math.abs(cx-85)*.12,r=14+R()*16;
    const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'rgba(255,255,255,.7)');g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2);
  }
  return SHARED.cloud=c;
}
const shCache={};
function shutter(col){
  if(shCache[col])return shCache[col];
  const[c,x]=mk(SH,WH);
  const g=x.createLinearGradient(0,0,SH,0);g.addColorStop(0,lit(col,.28));g.addColorStop(.5,col);g.addColorStop(1,drk(col,.38));
  x.fillStyle=g;x.fillRect(0,0,SH,WH);
  for(let y=3;y<WH-2;y+=3){x.fillStyle='rgba(0,0,0,.32)';x.fillRect(1,y,SH-2,1);x.fillStyle='rgba(255,255,255,.16)';x.fillRect(1,y+1,SH-2,.8)}
  x.strokeStyle='rgba(0,0,0,.5)';x.lineWidth=1;x.strokeRect(.5,.5,SH-1,WH-1);
  x.fillStyle='rgba(255,255,255,.25)';x.fillRect(1,1,SH-2,1);
  x.fillStyle='#1c1c20';x.fillRect(0,6,2.5,3);x.fillRect(0,WH-9,2.5,3);
  return shCache[col]=c;
}

function makeWallTile(th,parity){
  const[c,x]=mk(BW,ROWH),R=rng(th.height*7+parity*13+1);
  const base=(th.alt&&parity)?th.alt:th.wall;
  x.fillStyle=base;x.fillRect(0,0,BW,ROWH);
  if(th.style==='block'){
    x.fillStyle=drk(base,.42);x.fillRect(0,0,BW,ROWH);
    const bw=27,cs=16;
    for(let j=0;j<6;j++){
      const off=(j%2)*bw/2;
      for(let bx=-off;bx<BW;bx+=bw){
        const v=(R()-.5)*.22;
        x.fillStyle=v>0?lit(base,v):drk(base,-v);x.fillRect(bx+.9,j*cs+.9,bw-1.8,cs-1.8);
        x.fillStyle='rgba(255,255,255,.18)';x.fillRect(bx+.9,j*cs+.9,bw-1.8,1.2);
        x.fillStyle='rgba(0,0,0,.22)';x.fillRect(bx+.9,j*cs+cs-2.1,bw-1.8,1.2);
        if(R()<.3){x.fillStyle='rgba(0,0,0,.07)';x.fillRect(bx+2+R()*10,j*cs+3,8+R()*8,cs-7)}
      }
    }
  }else if(th.style==='lattice'){
    const main=parity?th.truss2:th.truss;
    const vg=x.createLinearGradient(0,0,0,ROWH);vg.addColorStop(0,'rgba(255,255,255,.07)');vg.addColorStop(1,'rgba(0,0,0,.18)');
    x.fillStyle=vg;x.fillRect(0,0,BW,ROWH);
    const ln=(ax,ay,bx,by,w)=>{
      x.lineCap='round';
      x.strokeStyle='rgba(0,0,0,.38)';x.lineWidth=w+2;x.beginPath();x.moveTo(ax+1,ay+1.6);x.lineTo(bx+1,by+1.6);x.stroke();
      x.strokeStyle=main;x.lineWidth=w;x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke();
      x.strokeStyle=lit(main,.55);x.lineWidth=Math.max(.8,w*.3);x.beginPath();x.moveTo(ax-.6,ay-.6);x.lineTo(bx-.6,by-.6);x.stroke();
    };
    for(let k=0;k<COLS;k++){const x0=k*CW;ln(x0,1,x0+CW,86,3);ln(x0+CW,1,x0,86,3)}
    for(let k=0;k<=COLS;k++)ln(k*CW,0,k*CW,87,3.8);
    for(let k=0;k<COLS;k++){
      [[k*CW+CW/2,43.5],[k*CW,1],[k*CW,86]].forEach(p=>{
        x.fillStyle=lit(main,.35);x.beginPath();x.arc(p[0],p[1],2.3,0,7);x.fill();
        x.fillStyle='rgba(0,0,0,.45)';x.beginPath();x.arc(p[0]+.6,p[1]+.6,1,0,7);x.fill();
        if(th.led){x.fillStyle=th.led;x.beginPath();x.arc(p[0],p[1],1.3,0,7);x.fill()}
      });
    }
  }else if(th.style==='piers'){
    for(let k=0;k<=COLS;k++){
      const px=k*CW-6,g=x.createLinearGradient(px,0,px+12,0);
      g.addColorStop(0,lit(base,.2));g.addColorStop(.5,lit(base,.05));g.addColorStop(1,drk(base,.2));
      x.fillStyle=g;x.fillRect(px,0,12,86);
      x.fillStyle='rgba(0,0,0,.13)';[3,6,9].forEach(o=>x.fillRect(px+o,0,1,86));
      x.fillStyle='rgba(255,255,255,.16)';[4,7,10].forEach(o=>x.fillRect(px+o,0,1,86));
    }
    for(let k=0;k<COLS;k++){
      const px=k*CW+8;
      x.fillStyle=drk(base,.26);x.fillRect(px,8,14,32);
      x.fillStyle=lit(base,.3);x.fillRect(px,8,14,1.2);
      x.fillStyle='rgba(0,0,0,.3)';x.fillRect(px,38.5,14,1.5);
      x.fillStyle='rgba(212,175,55,.9)';[4,7,10].forEach(o=>x.fillRect(px+o,12,1.4,24));
      x.fillStyle='rgba(255,236,160,.6)';[4,7,10].forEach(o=>x.fillRect(px+o,12,.6,24));
    }
  }else if(th.style==='steel'){
    const sg=x.createLinearGradient(0,0,BW,0);
    ['#808d9d','#dfe7ef','#9aa7b7','#eef3f8','#8794a4'].forEach((cc,i,a)=>sg.addColorStop(i/(a.length-1),cc));
    x.fillStyle=sg;x.fillRect(0,0,BW,ROWH);
    x.fillStyle='rgba(0,0,0,.2)';for(let i=0;i<=BW;i+=45)x.fillRect(i,0,1.2,86);
    x.fillStyle='rgba(255,255,255,.3)';for(let i=0;i<=BW;i+=45)x.fillRect(i+1.2,0,.8,86);
    for(let y=0;y<86;y+=1.5){x.fillStyle=R()<.5?'rgba(255,255,255,.04)':'rgba(0,0,0,.04)';x.fillRect(0,y,BW,1)}
    x.fillStyle='rgba(0,0,0,.2)';x.fillRect(0,41,BW,1.4);x.fillStyle='rgba(255,255,255,.4)';x.fillRect(0,42.4,BW,1);
  }else{ /* segment / glass curtain wall */
    const g=x.createLinearGradient(0,0,0,ROWH);g.addColorStop(0,lit(base,.2));g.addColorStop(1,drk(base,.16));
    x.fillStyle=g;x.fillRect(0,0,BW,ROWH);
    for(let i=0;i<=BW;i+=18){x.fillStyle='rgba(0,0,0,.24)';x.fillRect(i,0,1.4,86);x.fillStyle='rgba(255,255,255,.3)';x.fillRect(i+1.4,0,.9,86)}
    x.fillStyle='rgba(0,0,0,.15)';x.fillRect(0,38,BW,8);x.fillStyle='rgba(255,255,255,.22)';x.fillRect(0,38,BW,1);
    x.fillStyle='rgba(255,255,255,.09)';
    [[20,0,70,0,40,96,-10,96],[120,0,150,0,110,96,80,96],[200,0,240,0,205,96,165,96]].forEach(p=>{x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[2],p[3]);x.lineTo(p[4],p[5]);x.lineTo(p[6],p[7]);x.closePath();x.fill()});
  }
  /* lighting: left lit, right shaded */
  const lg0=x.createLinearGradient(0,0,BW,0);lg0.addColorStop(0,'rgba(255,255,255,.13)');lg0.addColorStop(.4,'rgba(255,255,255,0)');lg0.addColorStop(1,'rgba(0,0,0,.26)');
  x.fillStyle=lg0;x.fillRect(0,0,BW,ROWH);
  for(let i=0;i<520;i++){x.fillStyle=R()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.06)';x.fillRect(R()*BW,R()*ROWH,1.2,1.2)}
  /* shadow cast by the ledge above */
  const sg2=x.createLinearGradient(0,0,0,22);sg2.addColorStop(0,'rgba(0,0,0,.42)');sg2.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=sg2;x.fillRect(0,0,BW,22);
  /* ledge molding */
  const lg=x.createLinearGradient(0,85,0,95);lg.addColorStop(0,lit(th.ledge,.4));lg.addColorStop(.3,th.ledge);lg.addColorStop(1,drk(th.ledge,.4));
  x.fillStyle=lg;x.fillRect(0,85,BW,9);
  x.fillStyle='rgba(255,255,255,.45)';x.fillRect(0,85,BW,1);
  x.fillStyle='rgba(0,0,0,.5)';x.fillRect(0,94,BW,2);
  return c;
}
function makeWinSprite(th,litOn){
  const P=6,w=WW+2*P,h=WH+2*P,[c,x]=mk(w,h),f=th.win;
  x.fillStyle='rgba(0,0,0,.3)';wp(x,P-4,P-3,WW+8,WH+8,f.shape);x.fill();
  let g=x.createLinearGradient(0,P-3,0,P+WH+3);g.addColorStop(0,lit(f.frame,.38));g.addColorStop(.5,f.frame);g.addColorStop(1,drk(f.frame,.38));
  x.fillStyle=g;wp(x,P-3,P-3,WW+6,WH+6,f.shape);x.fill();
  x.fillStyle=drk(f.frame,.62);wp(x,P-1,P-1,WW+2,WH+2,f.shape);x.fill();
  const gg=x.createLinearGradient(0,P,0,P+WH);
  if(litOn){gg.addColorStop(0,'#fff0c2');gg.addColorStop(1,'#f0b24f')}
  else{gg.addColorStop(0,lit(f.glass,.5));gg.addColorStop(.5,f.glass);gg.addColorStop(1,drk(f.glass,.45))}
  x.fillStyle=gg;wp(x,P,P,WW,WH,f.shape);x.fill();
  x.save();wp(x,P,P,WW,WH,f.shape);x.clip();
  if(litOn){
    x.fillStyle='rgba(176,64,56,.6)';x.fillRect(P,P,3,WH);x.fillRect(P+WW-3,P,3,WH);
    x.fillStyle='rgba(255,255,255,.7)';x.beginPath();x.arc(P+WW/2,P+11,5,0,7);x.fill();
    x.fillStyle='rgba(70,44,30,.55)';x.fillRect(P,P+WH-9,WW,9);
  }else{
    x.fillStyle='rgba(255,255,255,.2)';x.beginPath();x.moveTo(P+1,P+WH);x.lineTo(P+7,P);x.lineTo(P+12,P);x.lineTo(P+5,P+WH);x.closePath();x.fill();
    x.fillStyle='rgba(255,255,255,.1)';x.beginPath();x.moveTo(P+13,P+WH);x.lineTo(P+16,P);x.lineTo(P+18,P);x.lineTo(P+15,P+WH);x.closePath();x.fill();
    x.fillStyle='rgba(0,0,0,.2)';x.fillRect(P,P+WH-8,WW,8);
  }
  const sh=x.createLinearGradient(0,P,0,P+10);sh.addColorStop(0,'rgba(0,0,0,.4)');sh.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=sh;x.fillRect(P,P,WW,10);
  x.restore();
  x.fillStyle=f.frame;x.fillRect(P,P+WH/2-1,WW,2);x.fillStyle=drk(f.frame,.45);x.fillRect(P,P+WH/2+1,WW,.8);
  x.fillStyle=lit(th.ledge,.32);x.fillRect(P-4,P+WH+1,WW+8,3);x.fillStyle='rgba(0,0,0,.4)';x.fillRect(P-4,P+WH+4,WW+8,1.5);
  return c;
}
function makeSky(th){
  const[c,x]=mk(W,H*2,1);
  const g=x.createLinearGradient(0,0,0,H*2);g.addColorStop(0,drk(th.sky[0],.6));g.addColorStop(.5,th.sky[0]);g.addColorStop(1,th.sky[1]);
  x.fillStyle=g;x.fillRect(0,0,W,H*2);
  const R=rng(th.height*3);
  if(th.night){
    for(let i=0;i<110;i++){const sx=R()*W,sY=R()*H*1.3,s=R()*1.4+.4;x.fillStyle=`rgba(255,255,255,${.4+R()*.5})`;x.fillRect(sx,sY,s,s)}
    const mg=x.createRadialGradient(285,H*2-430,0,285,H*2-430,60);mg.addColorStop(0,'rgba(255,250,225,.9)');mg.addColorStop(.25,'rgba(255,245,210,.4)');mg.addColorStop(1,'rgba(255,245,210,0)');
    x.fillStyle=mg;x.fillRect(180,H*2-560,200,260);x.fillStyle='#f4efd8';x.beginPath();x.arc(285,H*2-430,14,0,7);x.fill();
  }else{
    for(let i=0;i<40;i++){const sx=R()*W,sY=R()*H*.55;x.fillStyle=`rgba(255,255,255,${.12+R()*.25})`;x.fillRect(sx,sY,1.2,1.2)}
    const sx=th.motif==='dunes'?240:96,sY=H*2-230;
    const sg=x.createRadialGradient(sx,sY,0,sx,sY,240);sg.addColorStop(0,'rgba(255,244,214,.95)');sg.addColorStop(.18,'rgba(255,220,160,.55)');sg.addColorStop(.6,'rgba(255,190,120,.14)');sg.addColorStop(1,'rgba(255,190,120,0)');
    x.fillStyle=sg;x.fillRect(0,sY-260,W,520);
  }
  return c;
}
function makeSkyline(th,L){
  const hh=380,[c,x]=mk(W,hh,2),R=rng(th.height+L*101);
  const mixv=[.62,.38,0][L],col=mixc(th.sil,th.sky[1],mixv);
  const bw=[24,32,42][L],hmin=th.silH[0]*[1.5,1.2,1][L],hmax=th.silH[1]*[1.7,1.3,1][L];
  if(L===0&&th.motif==='fuji'){
    x.fillStyle=mixc(th.night?'#1d2350':'#4f5f8a',th.sky[1],.25);
    x.beginPath();x.moveTo(-110,hh);x.lineTo(30,hh-150);x.lineTo(170,hh);x.closePath();x.fill();
    x.fillStyle='rgba(235,240,250,.92)';x.beginPath();x.moveTo(6,hh-122);x.lineTo(30,hh-150);x.lineTo(54,hh-122);x.lineTo(40,hh-116);x.lineTo(30,hh-126);x.lineTo(18,hh-116);x.closePath();x.fill();
  }
  if(L===1&&th.motif==='dunes'){
    x.fillStyle='#d9ad6c';x.beginPath();x.moveTo(0,hh);
    for(let i=0;i<=W;i+=12)x.lineTo(i,hh-50-Math.sin(i*.02)*30-Math.sin(i*.05)*8);
    x.lineTo(W,hh);x.closePath();x.fill();
  }
  x.fillStyle=col;
  let xx=-8;
  while(xx<W){
    const w=bw*(.7+R()*.8),h=hmin+R()*(hmax-hmin);
    x.fillRect(xx,hh-h,w,h);
    if(th.motif==='paris'&&L>0){x.beginPath();x.moveTo(xx-2,hh-h);x.lineTo(xx+w/2,hh-h-14);x.lineTo(xx+w+2,hh-h);x.closePath();x.fill()}
    else if(R()<.22){x.fillRect(xx+w/2-1,hh-h-14,2,14)}
    if(L>0){
      const lp=th.night?.5:th.dusk?.2:.07;
      for(let wy=hh-h+6;wy<hh-4;wy+=7)for(let wx=xx+3;wx<xx+w-3;wx+=6)if(R()<lp){x.fillStyle=th.night?'rgba(255,230,150,.85)':'rgba(255,230,160,.6)';x.fillRect(wx,wy,2.4,3);x.fillStyle=col}
    }
    xx+=w+(L<2?1:3);
  }
  return{c,col};
}
const AS={};
function assets(){const i=(G.stage-1)%NT;return AS[i]||(AS[i]=genAssets(THEMES[i]))}
function genAssets(th){
  const a={};
  a.tiles=[makeWallTile(th,0)];a.tiles[1]=th.alt?makeWallTile(th,1):a.tiles[0];
  a.win=[makeWinSprite(th,false),makeWinSprite(th,true)];
  a.sky=makeSky(th);
  a.sk=[0,1,2].map(L=>makeSkyline(th,L));
  return a;
}

let ac;
function ensureAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(f,d=0.06,type='square',v=0.05){try{if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}

/* ================= particles ================= */
function emit(x,y,n,o){
  for(let i=0;i<n&&G.parts.length<420;i++){
    const a=rnd(0,Math.PI*2),sp=rnd(.3,1)*o.sp;
    G.parts.push({x,y,vx:Math.cos(a)*sp*(o.fx||1),vy:Math.sin(a)*sp*(o.fy||1)+(o.up||0),life:o.life*rnd(.7,1.2),max:o.life,size:o.size*rnd(.7,1.3),
      col:o.col[(Math.random()*o.col.length)|0],g:o.g||0,type:o.type||'dot',scr:!!o.scr,rot:rnd(0,6),vr:rnd(-8,8)});
  }
}
function updateParts(dt){
  for(const p of G.parts){
    p.life-=dt;p.vy-=p.g*dt;
    p.x+=p.vx*dt;p.y+=(p.scr?-p.vy:p.vy)*dt;p.rot+=p.vr*dt;
    if(p.type==='puff'){p.size+=dt*10}
  }
  G.parts=G.parts.filter(p=>p.life>0);
}
function drawParts(){
  for(const p of G.parts){
    const a=Math.max(0,Math.min(1,p.life/p.max)),X=p.x,Y=p.scr?p.y:sy(p.y);
    if(p.type==='spark'){
      ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;ctx.strokeStyle=p.col;ctx.lineWidth=p.size*.6;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(X,Y);ctx.lineTo(X-p.vx*.04,Y+(p.scr?-p.vy:p.vy)*-.04*(p.scr?-1:1));ctx.stroke();ctx.globalCompositeOperation='source-over';
    }else if(p.type==='conf'){
      ctx.globalAlpha=Math.min(1,a*1.5);ctx.save();ctx.translate(X,Y);ctx.rotate(p.rot);ctx.scale(1,Math.abs(Math.sin(p.rot*1.7))*.8+.2);ctx.fillStyle=p.col;ctx.fillRect(-p.size,-p.size*.5,p.size*2,p.size);ctx.restore();
    }else if(p.type==='puff'){
      ctx.globalAlpha=a*.5;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(X,Y,p.size,0,7);ctx.fill();
    }else if(p.type==='glow'){
      ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;const s=p.size*5;ctx.drawImage(glowSprite(p.col),X-s/2,Y-s/2,s,s);ctx.globalCompositeOperation='source-over';
    }else{
      ctx.globalAlpha=a;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(X,Y,p.size*(.5+.5*a),0,7);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}


/* ================= building silhouette (per landmark) ================= */
function makeProfile(th,R){
  const P=[],sym=w=>{w=Math.max(2,Math.min(10,w));const l=Math.floor((10-w)/2);return[l,l+w-1]},ev=v=>2*Math.round(v/2),sh=th.shape;
  for(let r=0;r<R;r++){
    const u=R>1?r/(R-1):0;let e;
    if(sh==='pisa')e=u<.12?[2,7]:u<.45?[3,6]:[4,7];
    else if(sh==='eliz')e=sym(u<.33?10:u<.66?4:u<.82?6:4);
    else if(sh==='sagrada')e=sym(u<.3?10:u<.6?8:u<.85?6:4);
    else if(sh==='eiffel')e=sym(ev(10-6*Math.pow(u,.9)));
    else if(sh==='tokyotower')e=sym(Math.min(10,ev(10-5.5*u)+((u>.33&&u<.43)?2:0)));
    else if(sh==='berlin')e=sym(u<.1?8:u<.62?4:u<.66?6:u<.76?8:u<.8?6:4);
    else if(sh==='empire')e=sym(u<.2?10:u<.45?8:u<.65?6:4);
    else if(sh==='petronas')e=sym(u<.12?10:u<.55?8:u<.85?6:4);
    else if(sh==='pearl')e=sym(u<.1?10:u<.22?4:u<.26?6:u<.34?8:u<.38?6:u<.55?4:u<.6?6:u<.66?6:4);
    else if(sh==='taipei'){
      if(u<.1)e=sym(8);
      else{const t=(u-.1)/.9*8,sg=Math.min(7,Math.floor(t)),f=t-Math.floor(t);e=sym((f<.5?6:8)-(sg>=6?2:0))}
    }
    else if(sh==='cn')e=sym(u<.08?10:u<.7?4:u<.74?6:u<.82?8:u<.86?6:4);
    else if(sh==='lotte')e=sym(ev(10-6*Math.pow(u,1.4)));
    else if(sh==='skytree')e=sym(u<.1?10:u<.2?8:u<.52?4:u<.58?6:u<.78?4:u<.83?6:4);
    else e=u<.12?[0,9]:u<.22?[1,9]:u<.32?[1,8]:u<.42?[2,8]:u<.52?[2,7]:u<.62?[3,7]:u<.72?[3,6]:[4,6];
    if(r===0)e=[0,9];
    P.push(e);
  }
  return P;
}
const rowX=r=>{const p=G.prof[Math.max(0,Math.min(G.rows-1,r))];return[BX+p[0]*CW,BX+(p[1]+1)*CW]};
const rowAtY=y=>Math.floor((y-84)/ROWH);
function extAt(py){
  let c0=0,c1=COLS-1;
  const a=rowAtY(py-34),b=rowAtY(py+38);
  for(let r=Math.max(0,a);r<=Math.min(G.rows-1,Math.max(a,b));r++){const p=G.prof[r];if(p[0]>c0)c0=p[0];if(p[1]<c1)c1=p[1]}
  if(c0>c1){c0=c1=Math.round((c0+c1)/2)}
  return[BX+c0*CW,BX+(c1+1)*CW];
}
function rndIn(x0,x1,m){const mm=Math.min(m,(x1-x0)/2-1);return x0+mm+Math.random()*Math.max(0,x1-x0-2*mm)}

/* ================= game logic ================= */
function pop(x,y,s,col){G.pops.push({x:Math.max(46,Math.min(W-46,x)),y,s,col,t:0})}
function addItem(type,x,y){G.items.push({type,x,y,ph:Math.random()*6,got:false})}
function build(){
  const idx=(G.stage-1)%NT;G.lap=Math.floor((G.stage-1)/NT);G.th=THEMES[idx];
  assets();
  G.rows=G.th.rows+4*G.lap;
  G.roofY=90+G.rows*ROWH+40;
  G.wins=[];G.prof=makeProfile(G.th,G.rows);
  const cols=['#2b7fd6','#d6402c','#3f9a4f','#8e44ad','#e67e22','#16a085'],hairs=['#222','#5a3a22','#c9a227','#777'];
  const th=G.th;
  for(let r=0;r<G.rows;r++)for(let c=G.prof[r][0];c<=G.prof[r][1];c++){
    if(Math.random()<0.88)G.wins.push({x:BX+c*CW+(CW-WW)/2,y:90+r*ROWH,ph:'idle',t:0,kind:'pot',
      litOn:th.night?Math.random()<0.6:th.dusk?Math.random()<0.22:false,
      col:cols[(Math.random()*cols.length)|0],hair:hairs[(Math.random()*hairs.length)|0],friend:r>=2&&Math.random()<0.07,gave:false});
  }
  G.items=[];
  for(let r=2;r<G.rows;r++){
    const iy=90+r*ROWH-26,roll=Math.random(),[ex0,ex1]=rowX(r);
    if(roll<0.30){const cx=rndIn(ex0,ex1,50);for(let i=-1;i<=1;i++)addItem('coin',cx+i*26,iy)}
    else if(roll<0.40)addItem('helmet',rndIn(ex0,ex1,24),iy);
    else if(roll<0.48)addItem('drink',rndIn(ex0,ex1,24),iy);
    else if(roll<0.50)addItem('heart',rndIn(ex0,ex1,24),iy);
    else if(roll<0.56)addItem('magnet',rndIn(ex0,ex1,24),iy);
  }
  G.objs=[];G.poops=[];G.pops=[];G.blobs=[];G.parts=[];G.bird=null;
  G.birdT=G.th.bird?G.th.bird*0.8:1e9;
  G.helmet=0;G.boost=0;G.splat=0;G.combo=0;G.comboPop=0;G.lastPress=-9;G.stageT=0;G.flash=0;
  G.coinsRun=0;G.hits=0;G.near=0;G.maxCombo=0;G.flow=0;G.zone=0;G.magnet=0;G.hs=0;G.slow=0;G.helmetMax=10;G.boostMax=6;G.magMax=10;G.clrM=[];G.clrStars=0;G.clrCoins=0;
  G.windS='idle';G.windT=rnd(4,7);G.windV=0;
  G.px=BX+BW/2;G.py=40;G.cam=40;G.maxY=40;G.slip=null;G.inv=0;
  G.lastHand=null;G.hL=-12;G.hR=-12;G.dirT=1.5;G.potT=2.5;G.legA=-1;
}
function saveHi(){if(G.score>G.hi){G.hi=Math.floor(G.score);try{localStorage.setItem('wc_hi',G.hi)}catch(e){}}}
function saveUnlock(){try{localStorage.setItem('wc_unlock2',G.unlocked)}catch(e){}}
function startGame(){G.score=0;G.lives=3+UP('l');G.stage=G.sel;build();G.mode='intro';G.modeT=0;beep(660,0.1)}
function selStage(d){
  if(typeof shopOpen!=='undefined'&&shopOpen)return;
  if(G.mode==='title')return;
  const n=Math.max(1,Math.min(G.unlocked,G.sel+d));
  if(n!==G.sel){G.sel=n;beep(600,0.04);if(G.mode==='map')G.mp.follow=true}
}
function addFlow(v){
  if(G.zone>0||G.mode!=='play')return;
  G.flow=Math.min(1,G.flow+v*(1+0.25*UP('z')));
  if(G.flow>=1)startZone();
}
function startZone(){
  G.zone=6;G.flow=1;G.flash=0.35;G.shake=0.2;vib([30,40,30]);
  pop(G.px,G.py+90,'ZONE！','#ffd23f');pop(G.px,G.py+128,'無敵＋得点×2','#fff3b0');
  [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'square',0.05),i*70));
  emit(G.px,G.py,26,{sp:170,life:.8,size:2.6,col:['#ffe27a','#fff','#ffa726'],type:'glow'});
}
function nearMiss(o){
  G.near++;G.slow=0.28;G.score+=150*(G.zone>0?2:1);
  pop(o.x,o.y+24,'ニアミス！','#7be0ff');beep(1400,0.06,'triangle',0.05);vib(8);
  emit(o.x,o.y,6,{sp:90,life:.35,size:1.8,col:['#bff3ff','#ffffff'],type:'spark'});
  addFlow(0.12);
  if(G.near===missionM())pop(G.px,G.py+120,'ミッション達成！','#ffd23f');
}
function giveMagnet(){G.magMax=10+2*UP('m');G.magnet=G.magMax;pop(G.px,G.py+50,'マグネット！','#d36bff');beep(760,0.12,'triangle',0.07);emit(G.px,G.py,12,{sp:90,life:.6,size:2.2,col:['#e8b8ff','#ffffff','#d36bff'],type:'glow'})}
function giveHelmet(){G.helmetMax=10+2*UP('h');G.helmet=G.helmetMax;pop(G.px,G.py+50,'ヘルメット！','#ffa726');beep(700,0.1,'triangle',0.07);emit(G.px,G.py+24,12,{sp:90,life:.6,size:2.2,col:['#ffd27a','#fff2c9','#ffa726'],type:'glow'})}
function giveBoost(){G.boostMax=6+UP('b');G.boost=G.boostMax;pop(G.px,G.py+50,'ブースト！','#4fc3f7');beep(900,0.12,'triangle',0.07);emit(G.px,G.py,14,{sp:110,life:.6,size:2.2,col:['#8fe3ff','#ffffff','#4fc3f7'],type:'glow'})}
function giveHeart(){
  if(G.lives<5){G.lives++;pop(G.px,G.py+50,'1UP！','#ff5a6e')}
  else{G.score+=300;pop(G.px,G.py+50,'+300','#ffd23f')}
  beep(1000,0.15,'triangle',0.07);emit(G.px,G.py,12,{sp:90,life:.7,size:2.2,col:['#ff9aa8','#ffffff','#ff5a6e'],type:'glow'});
}
function collect(it){
  if(it.type==='coin'){
    const z=G.zone>0?2:1;G.score+=100*z;G.coinsRun++;SAVE.coins++;
    pop(it.x,it.y+10,'+'+100*z,'#ffd23f');beep(880+Math.min(G.coinsRun,12)*18,0.05);vib(4);addFlow(0.025);
    emit(it.x,it.y,7,{sp:80,life:.45,size:1.8,col:['#ffe27a','#fff6c2'],type:'spark'});
    if(G.coinsRun===missionN())pop(G.px,G.py+120,'ミッション達成！','#ffd23f');
  }
  else if(it.type==='helmet')giveHelmet();
  else if(it.type==='drink')giveBoost();
  else if(it.type==='magnet')giveMagnet();
  else giveHeart();
}
function pressHand(h){
  ensureAudio();
  if(typeof shopOpen!=='undefined'&&shopOpen)return;
  if(G.mode==='title'){enterMap();return}
  if(G.mode==='map'){if(G.modeT>0.3)startGame();return}
  if(G.mode==='over'&&G.modeT>0.6){startGame();return}
  if(G.mode==='intro'){if(G.modeT>0.8){G.mode='play';G.modeT=0}return}
  if(G.mode==='clear'){if(G.modeT>1.2)nextStage();return}
  if(G.mode!=='play'||G.slip!=null)return;
  const mul=(G.boost>0?1.8:1)*(G.splat>0?0.5:1)*(G.th.rain?0.85:1)*(G.zone>0?1.35:1);
  let dy;
  if(G.lastHand!==h){
    const gap=G.t-G.lastPress;
    const old=G.combo;G.combo=(gap<0.35)?G.combo+1:1;if(G.combo>old&&G.combo>=5)G.comboPop=1;
    if(G.combo>G.maxCombo)G.maxCombo=G.combo;
    if(gap>0.1&&gap<0.32)addFlow(0.016);else if(gap>=0.32&&gap<0.6)addFlow(0.004);
    G.lastPress=G.t;G.lastHand=h;G.step++;
    dy=(16+Math.min(G.combo,20)*0.35)*mul;
    beep(h==='L'?520:660,0.04);
  }else{G.combo=0;G.lastPress=G.t;dy=3*mul}
  G.py+=dy;
  const hy=G.py-(h==='L'?G.hL:G.hR)+34,hxp=G.px+(h==='L'?-14:14);
  emit(hxp,G.py+30,2,{sp:26,life:.5,size:2.2,col:['#e8e2d6','#cfc8b8'],type:'puff',g:-14});
  if(G.boost>0)emit(G.px,G.py-24,2,{sp:40,life:.4,size:1.6,col:['#8fe3ff'],type:'spark'});
  if(G.py>G.maxY){
    const m=1+Math.min(4,Math.floor(G.combo/10))*0.5;
    G.score+=(G.py-G.maxY)*0.5*m*(G.zone>0?2:1);G.maxY=G.py;
  }
}
function hit(){
  G.lives--;G.inv=1.8;G.shake=0.35;G.flash=0.5;G.objs=[];G.combo=0;G.hits++;G.flow=0;G.hs=0.09;vib(70);
  beep(110,0.35,'sawtooth',0.08);
  emit(G.px,G.py,18,{sp:150,life:.6,size:2.4,col:['#ff6b4a','#ffd27a','#ffffff'],type:'spark',g:120});
  emit(G.px,G.py,8,{sp:70,life:.7,size:3,col:['#ffffff','#e6dccd'],type:'puff'});
  if(G.lives<=0){G.mode='over';G.modeT=0;G.sel=Math.min(G.unlocked,((G.stage-1)%NT)+1);saveHi();saveAll()}
  else G.slip=Math.max(40,G.py-70);
}
function doSplat(){
  G.splat=4;G.combo=0;G.blobs=[];
  for(let i=0;i<4;i++)G.blobs.push({x:rnd(50,310),y:rnd(60,300),r:rnd(24,50),d:rnd(20,60)});
  pop(G.px,G.py+50,'ふんが命中！','#e9ecef');beep(150,0.25,'sawtooth',0.06);
  emit(G.px,G.py+10,10,{sp:90,life:.6,size:2.4,col:['#f4f1e6','#d9d6c0'],type:'dot',g:200});
}
function ov(l,r,b,t){return G.px-15<r&&G.px+15>l&&G.py-34<t&&G.py+38>b}
function throwObj(w){
  const d=OBJ[w.kind],x=w.x+WW/2,y=w.y+WH+6,dy=Math.max(40,y-G.py);
  const tt=Math.max(0.35,(-d.v0+Math.sqrt(d.v0*d.v0+2*d.g*dy))/d.g);
  let vx=(G.px-x)/tt*rnd(0.85,1.05);vx=Math.max(-110,Math.min(110,vx));
  G.objs.push({type:w.kind,x,y,vx,vy:d.v0,rot:0});
  beep(300,0.05,'triangle',0.04);
  emit(x,y,4,{sp:30,life:.4,size:2.4,col:['#e8e2d6'],type:'puff'});
}
function director(dt){
  const dm=1/(1+0.2*G.lap),th=G.th;
  G.dirT-=dt;
  if(G.dirT<=0){
    G.dirT=Math.max(0.5,th.slam*dm)*rnd(0.7,1.3);
    const vis=G.wins.filter(w=>w.ph==='idle'&&!w.friend&&!w.gave&&w.y>G.cam-250&&w.y<G.cam+ANCHOR-40);
    const near=vis.filter(w=>Math.abs(w.x+WW/2-G.px)<60&&w.y>G.py-50&&w.y<G.py+220);
    const pool=(near.length&&Math.random()<0.7)?near:vis;
    if(pool.length){const w=pool[(Math.random()*pool.length)|0];w.ph='warn';w.t=0}
  }
  G.potT-=dt;
  if(G.potT<=0){
    G.potT=Math.max(0.65,th.pot*dm)*rnd(0.7,1.3);
    const vis=G.wins.filter(w=>w.ph==='idle'&&!w.friend&&!w.gave&&w.y>G.py+60&&w.y<G.cam+ANCHOR-30);
    const near=vis.filter(w=>Math.abs(w.x+WW/2-G.px)<85);
    const pool=(near.length&&Math.random()<0.6)?near:vis;
    if(pool.length){const w=pool[(Math.random()*pool.length)|0];w.ph='peek';w.t=0;w.kind=pickObj()}
  }
}
function updateWind(dt){
  const th=G.th;
  if(!th.wind){G.windV=0;return}
  G.windT-=dt;
  if(G.windS==='idle'&&G.windT<=0){G.windS='warn';G.windT=1.2;G.windDir=Math.random()<0.5?-1:1;pop(G.px,G.py+80,'強風！','#9fe3ff');beep(260,0.2,'triangle',0.05)}
  else if(G.windS==='warn'&&G.windT<=0){G.windS='gust';G.windT=1.8}
  else if(G.windS==='gust'&&G.windT<=0){G.windS='idle';G.windT=rnd(5,9)/th.wind}
  const target=G.windS==='gust'?G.windDir*70*(0.6+0.6*th.wind):0;
  G.windV+=(target-G.windV)*Math.min(1,dt*4);
}
function updateBird(dt){
  const th=G.th;
  if(!G.bird){
    G.birdT-=dt;
    if(G.birdT<=0&&G.py+300<G.roofY){
      const dir=Math.random()<0.5?1:-1;
      G.bird={dir,x:dir>0?-70:W+70,y:G.py+230,state:'warn',t:0,drop:0.5,aimed:false,flap:0};
    }
  }else{
    const b=G.bird;b.t+=dt;b.flap+=dt*9;
    b.y+=((G.py+230)-b.y)*Math.min(1,dt*1.5);
    if(b.state==='warn'){if(b.t>1.4){b.state='fly';b.t=0;beep(420,0.15,'triangle',0.06)}}
    else{
      b.x+=b.dir*th.birdSpd*(1+0.15*G.lap)*dt;b.drop-=dt;
      const near=Math.abs(b.x-G.px)<22;
      if((near&&!b.aimed)||b.drop<=0){
        if(near)b.aimed=true;
        b.drop=rnd(1.4,2.2);
        G.poops.push({x:b.x,y:b.y-12,vy:40,dead:false});
      }
      if((b.dir>0&&b.x>W+80)||(b.dir<0&&b.x<-80)){G.bird=null;G.birdT=rnd(0.75,1.25)*th.bird/(1+0.1*G.lap)}
    }
  }
}
function nextStage(){G.stage++;build();G.mode='intro';G.modeT=0}
function update(dt){
  if(G.slow>0){G.slow-=dt;dt*=0.5}
  if(G.hs>0&&G.mode==='play'){G.hs-=dt;return}
  G.t+=dt;G.modeT+=dt;if(G.shake>0)G.shake-=dt;if(G.flash>0)G.flash-=dt;if(G.comboPop>0)G.comboPop=Math.max(0,G.comboPop-dt*5);
  for(const p of G.pops)p.t+=dt;
  G.pops=G.pops.filter(p=>p.t<1.1);
  updateParts(dt);
  G.legA+=((G.step%2?1:-1)-G.legA)*Math.min(1,dt*14);
  if(G.mode==='intro'){
    if(G.modeT>3.2){G.mode='play';G.modeT=0}
  }else if(G.mode==='play'){
    G.stageT+=dt;
    if(G.helmet>0)G.helmet-=dt;
    if(G.boost>0)G.boost-=dt;
    if(G.magnet>0)G.magnet-=dt;
    if(G.zone>0){
      G.zone-=dt;G.flow=Math.max(0,G.zone/6);

    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(te[0],rt-18.5);ctx.lineTo(te[1],rt-18.5);ctx.stroke();

    for(let i=20;i>=0;i--){const u=i/20;ctx.lineTo(bx0+(bx1-bx0)*u,rt-34+Math.sin(G.t*4+u*7)*2.5)}

function mapTap(x,y){
  if(x<84&&y<40){G.mode='title';G.modeT=0;beep(500,0.05);return}
  if(y>=368&&y<504){if(x>238&&x<344&&y>460&&y<496)startGame();return}
  let best=-1,bd=22;
  for(let i=0;i<NT;i++){const[px,py]=pinScr(i),d=Math.hypot(px-x,py-y);if(d<bd){bd=d;best=i}}
  if(best>=0){
    if(best+1>G.unlocked){beep(200,0.12,'square',0.05);G.mp.toast=1.4;return}
    if(G.sel===best+1){startGame();return}
    G.sel=best+1;G.mp.follow=true;beep(700,0.05);
  }
}
cv.addEventListener('pointerdown',e=>{

  const[x,y]=lp(e);

  if(G.mode==='clear'){if(G.modeT>1.2)nextStage();return}

});

  const k=e.key;
  if(k==='ArrowLeft'){hold.l=true;e.preventDefault();if(!e.repeat&&(G.mode==='map'||G.mode==='over'))selStage(-1)}
  else if(k==='ArrowRight'){hold.r=true;e.preventDefault();if(!e.repeat&&(G.mode==='map'||G.mode==='over'))selStage(1)}
  else if(!e.repeat){
    if(k==='Escape'&&G.mode==='map'){G.mode='title';G.modeT=0}
    else if(k==='Enter'&&(G.mode==='map'||G.mode==='title'))pressHand('L');
    else if(k==='z'||k==='Z')pressHand('L');
    else if(k==='x'||k==='X')pressHand('R');
    else if(k==='ArrowUp'){pressHand(G.lastHand==='L'?'R':'L');e.preventDefault()}
    else if(k===' '){pressHand(G.lastHand==='L'?'R':'L');e.preventDefault()}
  }
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft')hold.l=false;
  if(e.key==='ArrowRight')hold.r=false;
});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= shop (DOM) ================= */
const helpEl=$('help'),helpBtn=$('helpBtn');
helpEl.innerHTML='<h2>遊び方・アイテム図鑑</h2><p>ビルの壁をよじ登り、屋上のゴールを目指そう。</p><h3>基本操作</h3><div class="step"><i>1</i><div><b>左手・右手ボタンを交互に押す</b>と登ります。同じ手を続けて押しても、ほとんど進みません。</div></div><div class="step"><i>2</i><div><b>◀ ▶ ボタンを押している間</b>、横に移動します（手足も動きます）。アイテムを取ったり、落ちてくる物を避けるのに使います。</div></div><div class="step"><i>3</i><div><b>パソコンの場合：</b>Z・X＝左右の手（またはSpace・↑で自動交互）、←→＝移動、Esc＝画面を閉じる。</div></div><div class="step"><i>4</i><div><b>コンボ：</b>0.35秒以内に交互に押し続けるとコンボが増え、少しずつ速く登れます。10コンボごとに得点が×0.5ずつ増え、最大×3になります。ダメージを受けるか、0.7秒止まるとリセットされます。</div></div><h3>アイテム</h3><div class="it"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#f5b820" stroke="#b87410" stroke-width="1.5"/><rect x="11" y="7" width="2" height="10" fill="#fff6c2"/></svg></div><div><b>コイン<span class="tag good">+100点</span></b><span>1枚ごとに100点。さらに強化ショップで使うコインが1枚貯まります。ミッションの対象にもなります。</span></div></div><div class="it"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 15a9 9 0 0 1 18 0z" fill="#f5a623"/><rect x="2" y="14" width="20" height="4" rx="1.5" fill="#d98a10"/><rect x="11" y="5" width="2" height="9" fill="rgba(0,0,0,.2)"/></svg></div><div><b>ヘルメット<span class="tag good">10秒</span></b><span>窓から投げられる物（植木鉢・缶・バケツ）を弾き返してダメージ無効。弾くと+50点。<b style="display:inline;font-size:inherit">シャッターと鳥のふんは防げません。</b></span></div></div><div class="it"><div class="ic"><svg viewBox="0 0 24 24"><rect x="8" y="5" width="8" height="15" rx="2.5" fill="#4fc3f7"/><rect x="8.5" y="2" width="7" height="3.5" fill="#dfe6ee"/><rect x="8" y="10" width="8" height="5" fill="#fff"/><path d="M12.5 10l-3 3h2l-1 3 3.5-4h-2z" fill="#f5a623"/></svg></div><div><b>ドリンク<span class="tag good">6秒</span></b><span>登る速さが1.8倍になります。ここぞという時の加速に。</span></div></div><div class="it"><div class="ic"><svg viewBox="0 0 24 24"><path d="M5 19v-7a7 7 0 0 1 14 0v7" fill="none" stroke="#e0364a" stroke-width="4.5"/><path d="M5 19v-3M19 19v-3" stroke="#eef2f8" stroke-width="4.5"/></svg></div><div><b>マグネット<span class="tag good">10秒</span></b><span>近くのコインを自動で引き寄せます。ショップで時間と吸引範囲を強化できます。</span></div></div><div class="it"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 21C4 15 2 11 2 8a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 3-2 7-10 13z" fill="#e63a5a" stroke="#7a0f26" stroke-width="1"/></svg></div><div><b>ハート<span class="tag good">1UP</span></b><span>ライフが1つ増えます（最大5つ）。5つのときは+300点になります。</span></div></div><div class="it"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 2l3 7 7.5.6-5.7 4.9 1.8 7.4L12 18l-6.6 3.9 1.8-7.4L1.5 9.6 9 9z" fill="#ffc83a" stroke="#8a5400" stroke-width="1"/></svg></div><div><b>★の住人<span class="tag good">プレゼント</span></b><span>窓に★マークの人がいたら近づこう。ヘルメット・ドリンク・マグネット・ハートのどれかをくれます。</span></div></div><h3>邪魔するもの</h3><div class="it"><div class="ic"><svg viewBox="0 0 24 24"><path d="M6 8h12l-2 12H8z" fill="#c8693a"/><rect x="5" y="6" width="14" height="3" rx="1" fill="#a9532b"/><path d="M12 6c-3-4-6-3-6-3s1 4 6 3zm0 0c3-4 6-3 6-3s-1 4-6 3z" fill="#4caf50"/></svg></div><div><b>窓から投げられる物<span class="tag bad">ダメージ</span></b><span>住人が窓から顔を出して、あなたに向けて投げます。当たるとライフ−1、少し下に滑り落ち、1.8秒は無敵です。顔を出したら横にずれて避けよう。</span></div></div><div class="it"><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="#3b5b44"/><path d="M5 7h14M5 11h14M5 15h14M5 19h14" stroke="#1d3326" stroke-width="1.6"/><path d="M12 1.5l3 5H9z" fill="#ffd23f"/></svg></div><div><b>シャッター<span class="tag bad">ダメージ</span></b><span>窓の周りが黄色く点滅したら、すぐ閉まる合図。窓の位置にいると挟まれてライフ−1になります。</span></div></div><div class="it"><div class="ic"><svg viewBox="0 0 24 24"><path d="M2 12c5-6 9-6 10 0 1-6 5-6 10 0-5-2-8-1-10 3-2-4-5-5-10-3z" fill="#e8ecf2" stroke="#7b8596" stroke-width="1"/><circle cx="12" cy="19" r="2.4" fill="#f4f1e6" stroke="#9a9a80"/></svg></div><div><b>大きな鳥のふん<span class="tag bad">ぬるぬる</span></b><span>鳥が横切りながらふんを落とします。当たると4秒間、画面が汚れて登る速さが半分に。<b style="display:inline;font-size:inherit">ヘルメットでは防げません。</b></span></div></div><div class="it"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 8h10a3 3 0 1 0-3-3M3 13h15a3 3 0 1 1-3 3M3 18h8" fill="none" stroke="#9fe3ff" stroke-width="2" stroke-linecap="round"/></svg></div><div><b>天候・環境<span class="tag bad">ステージ次第</span></b><span>強風（横に流される）、雨（登る速さが少し遅くなる）、夜、砂嵐（見えにくい）。ステージが進むほど増えていきます。</span></div></div><h3>ボーナス要素</h3><div class="box"><div class="it" style="background:none;border:none;padding:0;margin:0"><div class="ic"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z" fill="#ffd23f" stroke="#a15d00" stroke-width="1"/></svg></div><div><b>ZONE（ゾーン）</b><span>画面左上のゲージを満タンにすると発動。<br>◎ 左右の手をリズム良く（約0.1〜0.3秒間隔で）交互に押す<br>◎ コインを取る／ニアミスをする／ヘルメットで物を弾く<br>で溜まります。ダメージを受けると空に戻り、押すのを止めると少しずつ減ります。<br><b style="display:inline;font-size:inherit;color:#ffd23f">発動中の6秒間：無敵（シャッターも鳥のふんも効かない）／得点2倍／登る速さ1.35倍／コインを自動で吸い寄せ</b></span></div></div></div><div class="it"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="4" fill="#7be0ff"/><path d="M14 4l6 16" stroke="#fff" stroke-width="2" stroke-dasharray="2 2.5"/></svg></div><div><b>ニアミス<span class="tag good">+150点</span></b><span>落ちてくる物をギリギリで避けると発動。ZONEゲージが大きく溜まり、一瞬スローモーションになります。ヘルメット中・ZONE中は対象外です。</span></div></div><h3>ミッションと★</h3><p>各ステージに3つのミッションがあります。クリアしたとき、達成した数だけ★（最大3つ）が付きます。</p><p>・<b>ノーダメージ</b>：ダメージを一度も受けずにクリア<br>・<b>コイン○枚</b>：そのステージでコインを集める（枚数はステージの高さで変化）<br>・<b>ニアミス○回</b>：後半のステージほど回数が増えます</p><p>★1つにつき、クリアボーナス+500点とコイン+20枚。クリアするだけでも、ステージ番号×10枚のコインがもらえます。</p><h3>強化ショップ</h3><p>タイトル・ゲームオーバー画面の「強化・着せ替え」から使えます。貯めたコインで、ヘルメット／ドリンクの持続時間、マグネット強化、ゾーンの溜まりやすさ、初期ライフを強化できます。クライマーのスーツの色も変えられます。コインは途中でゲームオーバーになっても、集めた分は残ります。</p><h3>ステージとコツ</h3><p>世界14か国の名建築が舞台です。ピサの斜塔から始まり、ブルジュ・ハリファまで、進むほど高く、難しくなります。タイトル画面から世界地図が開きます。ピンをタップ（◀▶でも選べます）して、もう一度タップすると出発です。クリアすると次の国が解放され、全クリア後は難易度が上がった2周目に進みます。建物ごとに形が違い、上が細くなる所では、その幅の内側で登ります。</p><p>・ヘルメットとZONEを切らさないのがスコアの近道<br>・住人が顔を出したら、まず横に動いて避ける<br>・窓の上は危険。シャッターの点滅を見たら窓の位置を外す<br>・鳥の「！」マークが出たら、ふんが落ちる位置から離れる</p><button class="hx" data-x="1">閉じる</button>';
function openHelp(){shopOpen=true;helpEl.hidden=false;helpEl.scrollTop=0;beep(700,0.06)}
function closeHelp(){shopOpen=false;helpEl.hidden=true;beep(500,0.05)}
helpBtn.addEventListener('click',()=>{ensureAudio();openHelp()});
helpEl.addEventListener('click',e=>{if(e.target.closest('button.hx'))closeHelp()});
const shopEl=$('shop'),shopBtn=$('shopBtn');
let shopOpen=false,shopBtnShown=null;
function renderShop(){
  let h=`<div class="sh-h"><div class="sh-t">強化・着せ替え</div><div class="sh-c"><i class="coin"></i>${SAVE.coins}</div></div>`;
  h+='<div class="sh-s">パワーアップ</div>';
  for(const u of UPS){
    const lv=UP(u.k),mx=u.cost.length,maxed=lv>=mx,cost=u.cost[lv];
    h+=`<div class="sh-r"><div class="sh-n"><b>${u.name}</b><span>${u.desc}</span><div class="pips">${'<i class="on"></i>'.repeat(lv)}${'<i></i>'.repeat(mx-lv)}</div></div><button data-up="${u.k}" ${maxed||SAVE.coins<cost?'disabled':''}>${maxed?'MAX':'<i class="coin"></i>'+cost}</button></div>`;
  }
  h+='<div class="sh-s">着せ替え</div><div class="sh-g">';
  SUITS.forEach((s,i)=>{
    const own=SAVE.suits[i];
    h+=`<div class="sh-k${SAVE.suit===i?' sel':''}"><div class="sw" style="background:linear-gradient(135deg,${s.a},${s.b} 55%,${s.c})"></div><b>${s.n}</b><button data-suit="${i}" ${(!own&&SAVE.coins<s.cost)?'disabled':''}>${SAVE.suit===i?'装備中':own?'装備':'<i class="coin"></i>'+s.cost}</button></div>`;
  });
  h+='</div><button class="sh-x" data-close="1">閉じる</button>';
  shopEl.innerHTML=h;
}
function openShop(){shopOpen=true;renderShop();shopEl.hidden=false;beep(700,0.06)}
function closeShop(){shopOpen=false;shopEl.hidden=true;beep(500,0.05)}
function updShopBtn(){shopBtn.textContent='強化・着せ替え　（コイン '+SAVE.coins+'）'}
shopBtn.addEventListener('click',()=>{ensureAudio();openShop()});
shopEl.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  ensureAudio();
  if(b.dataset.close){closeShop();updShopBtn();return}
  if(b.dataset.up){
    const u=UPS.find(x=>x.k===b.dataset.up),lv=UP(u.k),cost=u.cost[lv];
    if(cost!=null&&SAVE.coins>=cost){SAVE.coins-=cost;SAVE.up[u.k]=lv+1;beep(1000,0.1,'triangle',0.07)}
  }else if(b.dataset.suit!==undefined){
    const i=+b.dataset.suit,s=SUITS[i];
    if(!SAVE.suits[i]&&SAVE.coins>=s.cost){SAVE.coins-=s.cost;SAVE.suits[i]=1}
    if(SAVE.suits[i]){SAVE.suit=i;beep(900,0.08,'triangle',0.07)}
  }
  saveAll();renderShop();updShopBtn();
});
addEventListener('keydown',e=>{if(e.key==='Escape'&&shopOpen){if(!helpEl.hidden)closeHelp();else{closeShop();updShopBtn()}}});
addEventListener('pagehide',saveAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveAll()});
updShopBtn();

build();
let last=performance.now();
function loop(ts){
  const dt=Math.min(0.033,(ts-last)/1000);last=ts;
  update(dt);draw();
  const sb=(G.mode==='title'||G.mode==='over')&&!shopOpen;
  if(sb!==shopBtnShown){shopBtnShown=sb;shopBtn.style.display=sb?'block':'none';helpBtn.style.display=sb?'block':'none';if(sb)updShopBtn()}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
